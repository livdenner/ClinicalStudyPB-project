        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Visitas previstas]
      parameters:
        - $ref: '#/components/parameters/StudyVersion'
      summary: Atualiza visita e lista completa de atividades
      description: |
        RESEARCHER responsável em PLANNING ou RECRUITMENT. IDs das atividades
        existentes são preservados; atividades omitidas são excluídas.
        A ordem da lista define posições 1..N. Ao menos uma atividade permanece.
        Omitir uma atividade que já tem resultado registrado (RF14) responde
        409 ACTIVITY_HAS_RESULTS.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannedVisitWriteRequest'
      responses:
