  /api/me/studies/{participantId}/withdrawal-request:
    parameters:
      - $ref: '#/components/parameters/ParticipantId'
    post:
      tags: [Dados do participante]
      summary: Solicita a retirada voluntária do estudo (RF20, T29.1)
      description: |
        Somente PARTICIPANT, dono da participação; outros perfis recebem 403.
        A conta vem do token, nunca de parâmetro.

        Registra solicitação de retirada voluntária com status=PENDING (no
        máximo 1 solicitação PENDING por participação). A participação
        permanece ACTIVE até que o coordenador efetive a saída pelo fluxo de
        RF16 (POST /api/studies/{studyId}/participants/{participantId}/withdrawal),
        que cancela as visitas futuras e conclui este pedido como COMPLETED. Não
        há recusa para solicitação de retirada voluntária.

        Usa bloqueio pessimista na ordem estudo -> participante (mesma ordem do
        RF16) para evitar duplicidade ou corrida com retirada e encerramento/
        cancelamento do estudo.

        Regras e erros (em ordem após validar formato e posse):
        - 400: corpo JSON malformado ou reason com mais de 500 caracteres após
          trim. Quando reason vier ausente, vazio ou só espaços após trim, o
          pedido é registrado sem motivo.
        - 404: participação inexistente ou pertencente a outra conta (sem
          revelar sua existência).
        - 409 STUDY_READ_ONLY: estudo em CLOSED ou CANCELLED (participações
          ACTIVE em estudo que retornou a PLANNING seguem podendo solicitar
          retirada voluntária).
        - 409 PARTICIPANT_ALREADY_WITHDRAWN: a participação já está em WITHDRAWN.
        - 409 WITHDRAWAL_REQUEST_ALREADY_PENDING: já existe solicitação PENDING
          em aberto para esta participação (inclusive em envios concorrentes).
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoluntaryWithdrawalRequestCreate'
            examples:
              comMotivo:
                value:
                  reason: Mudança de cidade impede comparecimento às próximas visitas
              semMotivo:
                value: {}
      responses:
        '201':
          description: Solicitação de retirada voluntária registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantWithdrawalRequestView'
              examples:
                comMotivo:
                  value:
                    id: 3
                    participantId: 5
                    studyId: 2
                    status: PENDING
                    reason: Mudança de cidade impede comparecimento às próximas visitas
                    requestedAt: '2026-11-26T12:30:00Z'
                semMotivo:
                  value:
                    id: 4
                    participantId: 6
                    studyId: 3
                    status: PENDING
                    requestedAt: '2026-11-26T13:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/me/visits:
    get:
      tags: [Dados do participante]
      summary: Lista as visitas do participante autenticado (RF18, T23.1)
      description: |
        Somente PARTICIPANT; outros perfis recebem 403. A conta vem do token,
        nunca de parâmetro, e só as visitas das participações da própria conta
        aparecem, de todos os seus estudos (inclusive de participação retirada).
        Cada visita inclui a lista de atividades previstas na ordem do protocolo
        (`[]` quando não houver).
        - upcoming: visitas SCHEDULED, aguardando desfecho, por scheduledAt
          crescente (a mais próxima primeiro). Inclui visita cuja data já passou
          e que ainda não teve o desfecho registrado.
        - history: visitas com desfecho DONE, ABSENT ou CANCELLED, por
          scheduledAt decrescente (a mais recente primeiro).
        Empates na mesma data seguem o id da visita. As duas listas vêm vazias
        quando a conta não tem visita. Visitas SCHEDULED podem incluir
        presenceConfirmedAt quando a presença prevista já foi confirmada (sem
        alterar status) e rescheduleRequest com a solicitação de reagendamento
        mais recente da visita (RF19). Observações da equipe sobre visitas
        realizadas ou ausências não são expostas; em CANCELLED, a justificativa
        vem em cancellationReason (e eventual recusa ou aceite de reagendamento
        aparece em rescheduleRequest).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Próximas visitas e histórico de desfechos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantVisits'
              example:
                upcoming:
                  - id: 15
                    studyId: 1
                    studyTitle: Acompanhamento de hipertensão
                    participantId: 4
                    plannedVisitId: 3
                    plannedVisitName: Retorno
                    scheduledAt: '2027-03-10T12:00:00Z'
                    status: SCHEDULED
                    presenceConfirmedAt: '2027-03-01T14:20:00Z'
                    activities:
                      - id: 22
                        name: Aferição clínica
                        description: Acompanhamento dos sinais vitais
                        position: 1
                history:
                  - id: 12
                    studyId: 1
                    studyTitle: Acompanhamento de hipertensão
                    participantId: 4
                    plannedVisitId: 2
                    plannedVisitName: Avaliação inicial
                    scheduledAt: '2027-02-01T12:00:00Z'
                    status: CANCELLED
                    outcomeAt: '2027-01-20T13:00:00Z'
                    cancellationReason: Participante pediu para remarcar
                    activities: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/me/visits/{visitId}/confirmation:
    parameters:
      - $ref: '#/components/parameters/VisitId'
    post:
      tags: [Dados do participante]
      summary: Confirma a presença prevista em visita agendada (RF19, T28.1)
      description: |
        Somente PARTICIPANT, dono da participação da visita; outros perfis
        recebem 403. A conta vem do token, nunca de parâmetro.

        Operação idempotente de intenção do participante: registra
        presenceConfirmedAt na primeira confirmação, mantém status=SCHEDULED
        (confirmar presença prevista nunca marca a visita como DONE) e
        preserva ScheduledVisit.version (não incrementa version, evitando
        conflito 409 VERSION_MISMATCH com registro de desfecho no RF13). Em
        nova chamada enquanto a visita permanecer válida (SCHEDULED, futura,
        participação ACTIVE e estudo não read-only), responde 200 preservando o
        presenceConfirmedAt original.

        Mesmo quando já existir solicitação de reagendamento PENDING para a
        visita, a API aceita a chamada (200) e mantém o pedido PENDING intacto,
        pois a visita original segue válida em SCHEDULED até decisão da
        coordenação (a UI mobile pode ocultar a ação enquanto PENDING).

        Regras e erros (bloqueio pessimista na ordem estudo -> participante ->
        visita):
        - 404: visita inexistente ou pertencente à participação de outra conta
          (sem revelar sua existência).
        - 409 STUDY_READ_ONLY: estudo em CLOSED ou CANCELLED (visitas SCHEDULED
          existentes em estudo que retornou a PLANNING permanecem confirmáveis).
        - 409 PARTICIPANT_WITHDRAWN: participação retirada (RF16).
        - 409 VISIT_OUTCOME_FINAL: a visita já está em DONE, ABSENT ou CANCELLED.
        - 409 VISIT_NOT_FUTURE: visita em SCHEDULED cuja data scheduledAt não é
          posterior ao instante atual.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Presença prevista confirmada (ou já confirmada anteriormente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantVisit'
              example:
                id: 15
                studyId: 1
                studyTitle: Acompanhamento de hipertensão
                participantId: 4
                plannedVisitId: 3
                plannedVisitName: Retorno
                scheduledAt: '2027-03-10T12:00:00Z'
                status: SCHEDULED
                presenceConfirmedAt: '2027-03-01T14:20:00Z'
                activities:
                  - id: 22
                    name: Aferição clínica
                    description: Acompanhamento dos sinais vitais
                    position: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/me/visits/{visitId}/reschedule-request:
    parameters:
      - $ref: '#/components/parameters/VisitId'
    post:
      tags: [Dados do participante]
      summary: Solicita o reagendamento de uma visita agendada (RF19, T28.1)
      description: |
        Somente PARTICIPANT, dono da participação da visita; outros perfis
        recebem 403. A conta vem do token, nunca de parâmetro.

        Cria uma solicitação de reagendamento com status PENDING (no máximo 1
        solicitação PENDING por visita). Enquanto a solicitação estiver PENDING
        (ou se for DECLINED/CANCELLED), a visita original permanece válida em
        SCHEDULED até que o coordenador aceite o pedido.

        Regras e erros (bloqueio pessimista na ordem estudo -> participante ->
        visita):
        - 400 RESCHEDULE_REASON_REQUIRED: reason ausente, vazio ou só espaços
          após trim.
        - 400: reason com mais de 500 caracteres após trim ou corpo JSON
          malformado.
        - 400 VISIT_DATE_NOT_FUTURE: suggestedScheduledAt informada não é
          posterior ao instante atual.
        - 400 VISIT_DATE_OUTSIDE_STUDY_PERIOD: suggestedScheduledAt informada
          está fora do período do estudo (startDate a endDate, dia no fuso
          America/Fortaleza).
        - 404: visita inexistente ou pertencente à participação de outra conta
          (sem revelar sua existência).
        - 409 STUDY_READ_ONLY: estudo em CLOSED ou CANCELLED (visitas SCHEDULED
          existentes em estudo que retornou a PLANNING aceitam abertura de
          pedido; o eventual aceite pelo coordenador exigirá RECRUITMENT ou
          EXECUTION).
        - 409 PARTICIPANT_WITHDRAWN: participação retirada (RF16).
        - 409 VISIT_OUTCOME_FINAL: a visita já está em DONE, ABSENT ou CANCELLED.
        - 409 VISIT_NOT_FUTURE: visita em SCHEDULED cuja data scheduledAt não é
          posterior ao instante atual.
        - 409 RESCHEDULE_REQUEST_ALREADY_PENDING: já existe solicitação PENDING
          em aberto para esta visita (inclusive em envios concorrentes).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitRescheduleRequestCreate'
            examples:
              comDataSugerida:
                value:
                  reason: Tenho exame em outra cidade na mesma manhã
                  suggestedScheduledAt: '2027-03-17T14:00:00-03:00'
              semDataSugerida:
                value:
                  reason: Preciso remarcar por compromisso médico inadiável
      responses:
        '201':
          description: Solicitação de reagendamento registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantRescheduleRequest'
              example:
                id: 7
                visitId: 15
                status: PENDING
                reason: Tenho exame em outra cidade na mesma manhã
                suggestedScheduledAt: '2027-03-17T17:00:00Z'
                createdAt: '2027-03-01T15:10:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/monitoring/dashboard:
    get:
      tags: [Monitoramento]
      summary: Consulta o painel consolidado de acompanhamento (RF21, T30.1)
      description: |
        Somente RESEARCHER e COORDINATOR; ADMINISTRATOR e PARTICIPANT recebem
        403 (decisão de PO alinhada ao enunciado). Retorna os indicadores reais
        consolidados em summary e detalhados por estudo em studies (ordenados por
        studyId crescente), sem listagem nominal de participantes/candidatos e
        sem dados fictícios hardcoded. Em banco vazio, summary traz zeros
        válidos e studies vem como [].

        Definição matemática compartilhada com RF22 (/report e /report.csv):
        - participants.total = active + withdrawn (vagas ocupadas, pois
          retirada não devolve vaga); participants.distinctPeople conta userId
          únicos entre participantes incluídos no escopo.
        - candidates.total = soma dos 7 estados de CandidateStatus (byStatus);
          candidates.distinctPeople conta userId únicos entre essas
          candidaturas.
        - candidates.byEligibility (pending, eligible, ineligible) considera
          apenas candidaturas não canceladas (status != CANCELLED), garantindo
          pending + eligible + ineligible = total - byStatus.cancelled.
        - visits.total = done + absent + cancelled + pending; visits.pending
          considera todas as visitas SCHEDULED (incluindo vencidas sem
          desfecho), e visits.overduePending é o subconjunto de pending com
          scheduledAt <= generatedAt.
      security:
        - bearerAuth: []
      parameters:
        - name: studyId
          in: query
          required: false
          description: Filtra o painel para um único estudo; estudo inexistente responde 404
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Indicadores consolidados e detalhados por estudo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringDashboard'
              example:
