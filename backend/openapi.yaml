  /api/studies/{studyId}/report:
    parameters:
      - $ref: '#/components/parameters/StudyId'
    get:
      tags: [Monitoramento]
      summary: Gera o relatório simplificado do estudo em JSON (RF22, T30.1)
      description: |
        Somente RESEARCHER e COORDINATOR; ADMINISTRATOR e PARTICIPANT recebem
        403. Retorna exclusivamente agregados gerenciais do estudo (sem PDF e
        sem listagem nominal de pacientes/candidatos), usando exatamente as
        mesmas definições matemáticas do painel RF21.

        Filtros opcionais startDate e endDate (YYYY-MM-DD, inclusive, no fuso
        America/Fortaleza):
        - Sem filtros, candidates, participants e visits coincidem exatamente com
          o detalhamento do estudo em GET /api/monitoring/dashboard.
        - Com filtro de período, visits considera scheduledAt e participants
          considera includedAt dentro do intervalo [startDate, endDate];
          candidates reflete o retrato consolidado atual do estudo.
        - Se startDate > endDate, responde 400 INVALID_REPORT_PERIOD.
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: false
          description: Data inicial opcional do recorte (YYYY-MM-DD, inclusive, fuso America/Fortaleza)
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          description: Data final opcional do recorte (YYYY-MM-DD, inclusive, fuso America/Fortaleza)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Relatório agregado do estudo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyReport'
              example:
                generatedAt: '2026-11-26T15:00:00Z'
                studyId: 1
                studyTitle: Acompanhamento de hipertensão
                studyStatus: EXECUTION
                studyStartDate: '2027-01-01'
                studyEndDate: '2027-12-31'
                participantLimit: 30
                candidates:
                  total: 15
                  distinctPeople: 14
                  byStatus:
                    invited: 1
                    active: 2
                    consentPending: 1
                    granted: 1
                    declined: 1
                    included: 8
                    cancelled: 1
                  byEligibility:
                    pending: 2
                    eligible: 11
                    ineligible: 1
                participants:
                  total: 8
                  active: 6
                  withdrawn: 2
                  distinctPeople: 8
                visits:
                  total: 20
                  done: 10
                  absent: 2
                  cancelled: 3
                  pending: 5
                  overduePending: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/studies/{studyId}/report.csv:
    parameters:
      - $ref: '#/components/parameters/StudyId'
    get:
      tags: [Monitoramento]
      summary: Exporta o relatório simplificado do estudo em CSV (RF22, T30.1)
      description: |
        Somente RESEARCHER e COORDINATOR; ADMINISTRATOR e PARTICIPANT recebem
        403. Aplica exatamente os mesmos filtros (startDate e endDate) e os
        mesmos cálculos agregados de GET /api/studies/{studyId}/report, sem
        listagem nominal de pacientes.

        Formato de resposta:
        - Content-Type text/csv com encoding UTF-8 e Content-Disposition
          attachment; filename="relatorio-estudo-{studyId}.csv".
        - Estrutura tabular com cabeçalho secao,indicador,valor e escape RFC
          4180.
        - Proteção contra CSV formula injection: células textuais iniciadas por
          =, +, -, @ ou precedidas por tab/CR recebem prefixo ' antes da
          serialização.
        - Se startDate > endDate, responde 400 INVALID_REPORT_PERIOD.
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: false
          description: Data inicial opcional do recorte (YYYY-MM-DD, inclusive, fuso America/Fortaleza)
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          description: Data final opcional do recorte (YYYY-MM-DD, inclusive, fuso America/Fortaleza)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Arquivo CSV com os indicadores agregados do estudo
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Anexo para download no formato attachment; filename="relatorio-estudo-{studyId}.csv"
          content:
            text/csv:
              schema:
                type: string
              example: |
                secao,indicador,valor
                estudo,studyId,1
                estudo,studyTitle,Acompanhamento de hipertensão
                estudo,studyStatus,EXECUTION
                estudo,studyStartDate,2027-01-01
                estudo,studyEndDate,2027-12-31
                estudo,participantLimit,30
                filtro,filterStartDate,
                filtro,filterEndDate,
                filtro,generatedAt,2026-11-26T15:00:00Z
                candidatos,total,15
                candidatos,distinctPeople,14
                candidatos,invited,1
                candidatos,active,2
                candidatos,consentPending,1
                candidatos,granted,1
                candidatos,declined,1
                candidatos,included,8
                candidatos,cancelled,1
                candidatos,eligibilityPending,2
                candidatos,eligibilityEligible,11
                candidatos,eligibilityIneligible,1
                participantes,total,8
                participantes,active,6
                participantes,withdrawn,2
                participantes,distinctPeople,8
                visitas,total,20
                visitas,done,10
                visitas,absent,2
                visitas,cancelled,3
                visitas,pending,5
                visitas,overduePending,1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/patients:
    get:
      tags: [Pacientes]
      summary: Lista contas de pacientes/candidatos com resumo de estudos (Backlog 2.2, T32.1)
      description: |
        Somente COORDINATOR; ADMINISTRATOR, RESEARCHER e PARTICIPANT recebem 403.
        Lista exclusivamente contas com perfil PARTICIPANT (nunca misturadas a
        /api/users), ordenadas por nome (sem diferença de maiúsculas) e userId
        crescente, sem nenhuma operação de exclusão física (DELETE). Em cada
        conta, studies traz o histórico completo de candidaturas e participações
        (incluindo CANCELLED), ordenado por studyId e candidateId crescentes.
        Retorna [] quando não há registros para os filtros aplicados.

        Estados derivados da conta (PatientAccountStatus):
        - ACTIVE: conta ativada pelo participante (active=true,
          activationPending=false e archivedAt ausente).
        - PENDING_ACTIVATION: conta nunca ativada (activationPending=true,
          archivedAt ausente) com convite ainda vigente (expiresAt > agora).
        - EXPIRED: conta nunca ativada (activationPending=true, archivedAt
          ausente) cujo convite venceu (expiresAt <= agora) ou foi invalidado
          antes da ativação; elegível para POST /api/patients/{userId}/archive-expired.
        - ARCHIVED: conta nunca ativada arquivada logicamente (archivedAt
          preenchido). Não autentica nem ativa código antigo; ao emitir novo
          convite (recadastro em POST /api/studies/{studyId}/candidates ou
          reemissão em POST /api/studies/{studyId}/candidates/{candidateId}/invitation),
          archivedAt é limpo e a conta retorna para PENDING_ACTIVATION.
        - DEACTIVATED: conta desativada pelo coordenador (active=false,
          activationPending=false, archivedAt ausente), preservando todo o
          histórico de candidaturas e participações.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra pela situação derivada da conta PARTICIPANT
          schema:
            $ref: '#/components/schemas/PatientAccountStatus'
        - name: search
          in: query
          required: false
          description: Busca textual parcial (case-insensitive) por nome ou e-mail da conta
          schema:
            type: string
            maxLength: 120
      responses:
        '200':
          description: Contas de pacientes/candidatos encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientAccount'
              example:
                - userId: 9
                  name: Ana Souza
                  email: ana.souza@exemplo.test
                  accountStatus: ACTIVE
                  hasActiveParticipation: true
                  studies:
                    - studyId: 1
                      studyTitle: Acompanhamento de hipertensão
                      studyStatus: EXECUTION
                      candidateId: 14
                      candidateStatus: INCLUDED
                      participantId: 4
                      participationStatus: ACTIVE
                - userId: 15
                  name: Bruno Costa
                  email: bruno.costa@exemplo.test
                  accountStatus: EXPIRED
                  hasActiveParticipation: false
                  activationExpiresAt: '2026-11-20T12:00:00Z'
                  studies:
                    - studyId: 1
                      studyTitle: Acompanhamento de hipertensão
                      studyStatus: RECRUITMENT
                      candidateId: 21
                      candidateStatus: INVITED
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/patients/{userId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Pacientes]
      summary: Desativa com segurança uma conta de paciente (Backlog 2.3, T32.1)
      description: |
        Somente COORDINATOR; ADMINISTRATOR, RESEARCHER e PARTICIPANT recebem 403.
        Desativa uma conta PARTICIPANT em transação com bloqueio pessimista da
        conta sem apagar usuários, candidaturas, participações ou histórico, e
        invalida eventual convite de ativação ainda não utilizado. Quando a
        conta estiver em ARCHIVED, a desativação limpa archivedAt e transita a
        conta para DEACTIVATED (200 OK). Após desativada, a conta não autentica
        em /api/auth/login (401) nem ativa código antigo em /api/auth/activation
        (400 ACTIVATION_INVALID).

        Regras e erros:
        - 404: usuário inexistente ou cujo perfil não é PARTICIPANT (contas da
          equipe continuam em /api/users).
        - 409 PATIENT_ALREADY_DEACTIVATED: a conta já está em DEACTIVATED.
        - 409 PATIENT_HAS_ACTIVE_PARTICIPATION: a conta possui participação com
          status ACTIVE em ao menos um estudo; é necessário registrar a retirada
          do participante via RF16 antes de desativar a conta.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conta do paciente desativada com histórico preservado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientAccount'
              example:
                userId: 9
                name: Ana Souza
                email: ana.souza@exemplo.test
                accountStatus: DEACTIVATED
                hasActiveParticipation: false
                studies:
                  - studyId: 1
                    studyTitle: Acompanhamento de hipertensão
                    studyStatus: EXECUTION
                    candidateId: 14
                    candidateStatus: INCLUDED
                    participantId: 4
                    participationStatus: WITHDRAWN
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/patients/{userId}/archive-expired:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Pacientes]
      summary: Arquiva conta de paciente nunca ativada com convite expirado (Backlog 2.4, T32.1)
      description: |
        Somente COORDINATOR; ADMINISTRATOR, RESEARCHER e PARTICIPANT recebem 403.
        Marca logicamente (archivedAt) uma conta PARTICIPANT em estado EXPIRED
        (nunca ativada e com convite vencido ou ausente), sem excluir
        candidaturas nem registros históricos, e invalida o convite pendente.
        Conta arquivada não autentica nem ativa código antigo; ao emitir novo
        convite (recadastro em POST /api/studies/{studyId}/candidates ou
        reemissão em POST /api/studies/{studyId}/candidates/{candidateId}/invitation),
        archivedAt é limpo e a conta retorna para PENDING_ACTIVATION.

        Regras e erros:
        - 404: usuário inexistente ou cujo perfil não é PARTICIPANT.
        - 409 PATIENT_NOT_EXPIRED: a conta não está em EXPIRED (inclui contas
          em ACTIVE, PENDING_ACTIVATION com convite vigente, DEACTIVATED ou já
          em ARCHIVED).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conta expirada arquivada logicamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientAccount'
              example:
                userId: 15
                name: Bruno Costa
                email: bruno.costa@exemplo.test
                accountStatus: ARCHIVED
                hasActiveParticipation: false
                archivedAt: '2026-11-26T15:30:00Z'
                studies:
                  - studyId: 1
                    studyTitle: Acompanhamento de hipertensão
                    studyStatus: RECRUITMENT
                    candidateId: 21
                    candidateStatus: INVITED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: Identificador BIGINT do usuário
      schema:
        type: integer
        format: int64
        minimum: 1
    StudyId:
      name: studyId
      in: path
      required: true
      description: Identificador BIGINT do estudo
      schema:
        type: integer
        format: int64
        minimum: 1
    StudyVersion:
      name: If-Match
      in: header
      required: true
      description: |
        ETag forte com Study.version entre aspas, por exemplo "0".
        Divergência responde 409.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    CriterionId:
      name: criterionId
      in: path
      required: true
      description: Identificador BIGINT do critério
      schema:
        type: integer
        format: int64
        minimum: 1
    PlannedVisitId:
      name: plannedVisitId
      in: path
      required: true
      description: Identificador BIGINT da visita prevista
      schema:
        type: integer
        format: int64
        minimum: 1
    CandidateId:
      name: candidateId
      in: path
      required: true
      description: Identificador BIGINT do candidato
      schema:
        type: integer
        format: int64
        minimum: 1
    ParticipantId:
      name: participantId
      in: path
      required: true
      description: Identificador BIGINT do participante
      schema:
        type: integer
        format: int64
        minimum: 1
    VisitId:
      name: visitId
      in: path
      required: true
      description: Identificador BIGINT da visita agendada
      schema:
        type: integer
        format: int64
        minimum: 1
    VisitVersion:
      name: If-Match
      in: header
      required: true
      description: |
        ETag forte com ScheduledVisit.version entre aspas, por exemplo "0".
        É a versão da visita agendada, não a do estudo. Divergência responde 409.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    ActivityId:
      name: activityId
      in: path
      required: true
      description: Identificador BIGINT da atividade da visita prevista
      schema:
        type: integer
        format: int64
        minimum: 1
    RescheduleRequestId:
      name: requestId
      in: path
      required: true
      description: Identificador BIGINT da solicitação de reagendamento
      schema:
        type: integer
        format: int64
        minimum: 1
    RescheduleRequestVersion:
      name: If-Match
      in: header
      required: true
      description: |
        ETag forte com VisitRescheduleRequest.version entre aspas, por exemplo "0".
        É a versão da solicitação de reagendamento, não a da visita nem a do estudo.
        Divergência responde 409.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
  schemas:
    UserRole:
      type: string
      description: Perfil de acesso do usuário
      enum: [RESEARCHER, COORDINATOR, ADMINISTRATOR, PARTICIPANT]
    UserCreateRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 255
          description: Deve ser único
        password:
          type: string
          writeOnly: true
          description: Senha de entrada; o backend deve armazenar somente o hash BCrypt
        role:
          $ref: '#/components/schemas/UserRole'
    UserUpdateRequest:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 255
          description: Deve permanecer único
        role:
          $ref: '#/components/schemas/UserRole'
    User:
      type: object
      required: [id, name, email, role, active]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 255
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
        mustChangePassword:
          type: boolean
          readOnly: true
          default: false
          description: |
            true na sessão aberta pela ativação do candidato, até a senha ser
            definida em PUT /api/auth/password. Enquanto true, só a troca de
            senha e o logout são aceitos.
    ActivationRequest:
      type: object
      required: [email, activationCode]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        activationCode:
          type: string
          minLength: 1
          maxLength: 32
          writeOnly: true
          description: Código de uso único exibido ao coordenador no cadastro do candidato
    PasswordChangeRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          writeOnly: true
          description: Obrigatória quando mustChangePassword=false
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          pattern: '^(?=.*[A-Za-z])(?=.*[0-9]).{8,72}$'
          writeOnly: true
          description: 8 a 72 caracteres, com ao menos uma letra e um número
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: JWT para as chamadas autenticadas
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          format: int64
          description: Validade do token em segundos
        user:
          $ref: '#/components/schemas/User'
    StudyWriteRequest:
      type: object
      required: [title, objective, responsibleUserId, startDate, endDate, participantLimit]
      properties:
        title:
          type: string
          maxLength: 200
        objective:
          type: string
        responsibleUserId:
          type: integer
          format: int64
          minimum: 1
          description: Referência a um usuário responsável existente e ativo
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Deve ser igual ou posterior a startDate
        participantLimit:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
    Study:
      type: object
      required: [id, title, objective, responsibleUserId, startDate, endDate, participantLimit, status, version]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
          maxLength: 200
        objective:
          type: string
        responsibleUserId:
          type: integer
          format: int64
          minimum: 1
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        participantLimit:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
        status:
          $ref: '#/components/schemas/StudyStatus'
        version:
          type: integer
          format: int64
          readOnly: true
    StudyStatus:
      type: string
      description: |
        PLANNING=Planejamento; RECRUITMENT=Recrutamento;
        EXECUTION=Em execução; CLOSED=Encerrado; CANCELLED=Cancelado.
      enum: [PLANNING, RECRUITMENT, EXECUTION, CLOSED, CANCELLED]
      default: PLANNING
    StudyStatusChangeRequest:
      type: object
      required: [status, expectedStatus]
      properties:
        status:
          $ref: '#/components/schemas/StudyStatus'
        expectedStatus:
          $ref: '#/components/schemas/StudyStatus'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Obrigatória quando status é CANCELLED
    StudyStatusHistory:
      type: object
      required: [id, actorUserId, changedAt, fromStatus, toStatus]
      properties:
        id:
          type: integer
          format: int64
        actorUserId:
          type: integer
          format: int64
        changedAt:
          type: string
          format: date-time
        fromStatus:
          $ref: '#/components/schemas/StudyStatus'
        toStatus:
          $ref: '#/components/schemas/StudyStatus'
        reason:
          type: string
    CriterionType:
      type: string
      description: Critério de inclusão ou exclusão
      enum: [INCLUSION, EXCLUSION]
    StudyCriterionWriteRequest:
      type: object
      required: [type, description]
      properties:
        type:
          $ref: '#/components/schemas/CriterionType'
        description:
          type: string
          minLength: 1
          maxLength: 500
    StudyCriterion:
      type: object
      required: [id, studyId, type, description]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        studyId:
          type: integer
          format: int64
          readOnly: true
        type:
          $ref: '#/components/schemas/CriterionType'
        description:
          type: string
          maxLength: 500
    PlannedActivityWriteRequest:
      type: object
      required: [name, description]
      properties:
        id:
          type: integer
          format: int64
          description: ID existente para preservar a atividade em uma edição
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 500
    PlannedActivity:
      type: object
      required: [id, name, description, position]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 500
        position:
          type: integer
          minimum: 1
    PlannedVisitWriteRequest:
      type: object
      required: [name, plannedDate, activities]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        plannedDate:
          type: string
          format: date
          description: Data prevista dentro do período do estudo
        position:
          type: integer
          minimum: 1
          description: Posição de inserção; nula para anexar ao fim
        activities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PlannedActivityWriteRequest'
    PlannedVisit:
      type: object
      required: [id, studyId, name, plannedDate, position, activities]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        studyId:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          maxLength: 120
        plannedDate:
          type: string
          format: date
        position:
          type: integer
          minimum: 1
        activities:
          type: array
          items:
            $ref: '#/components/schemas/PlannedActivity'
    PlannedVisitOrderRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
    CandidateCreateRequest:
      type: object
      required: [name, age, email, phone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        age:
          type: integer
          format: int32
          minimum: 1
          maximum: 130
          description: Idade informada no cadastro; elegibilidade depende dos critérios do estudo
        email:
          type: string
          format: email
          maxLength: 255
          description: Identifica a conta PARTICIPANT do candidato; comparação sem diferença de maiúsculas
        phone:
          type: string
          minLength: 8
          maxLength: 20
          pattern: '^\+?[0-9 ()-]{8,20}$'
          description: Telefone fictício com DDD; aceita dígitos, espaço, parênteses, hífen e + inicial
    CandidateStatus:
      type: string
      description: |
        Andamento do candidato no fluxo de identidade e consentimento, calculado
        pelo backend. Não substitui eligibilityStatus, que segue separado.
        - INVITED=Convidado: conta criada, aguardando o primeiro acesso.
        - ACTIVE=Conta ativa: conta ativa, elegibilidade ainda não ELIGIBLE.
        - CONSENT_PENDING=Aguardando decisão: conta ativa e ELIGIBLE, sem decisão;
          o convite aparece no app.
        - GRANTED=Aceitou: o candidato aceitou o termo simulado.
        - DECLINED=Recusou: o candidato recusou o termo simulado.
        - INCLUDED=Incluído: o coordenador incluiu o candidato como participante.
        - CANCELLED=Cancelado: o coordenador cancelou a candidatura antes da
          inclusão. É final; a pessoa pode ser cadastrada de novo no estudo.
      enum: [INVITED, ACTIVE, CONSENT_PENDING, GRANTED, DECLINED, INCLUDED, CANCELLED]
    CandidateCancellationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Motivo do cancelamento; espaços nas extremidades são removidos
    CandidateActivation:
      type: object
      required: [expiresAt, expired]
      properties:
        expiresAt:
          type: string
          format: date-time
          description: Emissão do código + 72 horas
        expired:
          type: boolean
          description: true quando o prazo passou; o coordenador pode gerar um novo código
        activationCode:
          type: string
          readOnly: true
          description: |
            Somente demonstração (Sprint 3): exibido ao coordenador enquanto não
            há envio por e-mail. Aparece apenas nas respostas do cadastro do
            candidato e de geração de novo código, no momento em que o código é
            gerado; nenhuma consulta posterior o devolve. Será removido quando o
            código passar a ser enviado ao candidato. Não deve ser guardado nem
            registrado em log.
    Candidate:
      type: object
      required: [id, studyId, name, age, email, phone, userId, status, eligibilityStatus, consentStatus]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        studyId:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          maxLength: 120
        age:
          type: integer
          format: int32
          minimum: 1
          maximum: 130
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          maxLength: 20
        userId:
          type: integer
          format: int64
          readOnly: true
          description: Conta PARTICIPANT vinculada ao candidato
        status:
          $ref: '#/components/schemas/CandidateStatus'
        eligibilityStatus:
          $ref: '#/components/schemas/EligibilityStatus'
        consentStatus:
          $ref: '#/components/schemas/ConsentStatus'
        activation:
          $ref: '#/components/schemas/CandidateActivation'
        cancellation:
          $ref: '#/components/schemas/CandidateCancellation'
    CandidateCancellation:
      type: object
      description: Presente só quando status=CANCELLED
      required: [reason, cancelledAt, cancelledByUserId]
      properties:
        reason:
          type: string
          maxLength: 500
        cancelledAt:
          type: string
          format: date-time
          readOnly: true
        cancelledByUserId:
          type: integer
          format: int64
          readOnly: true
    EligibilityStatus:
      type: string
      description: PENDING=Pendente; ELIGIBLE=Elegível; INELIGIBLE=Não elegível
      enum: [PENDING, ELIGIBLE, INELIGIBLE]
      default: PENDING
    EligibilityAnswerWriteRequest:
      type: object
      required: [criterionId, matches]
      properties:
        criterionId:
          type: integer
          format: int64
          minimum: 1
        matches:
          type: boolean
          description: Indica se a condição descrita no critério se aplica ao candidato
    EligibilityAnswer:
      type: object
      required: [criterionId, matches]
      properties:
        criterionId:
          type: integer
          format: int64
        matches:
          type: boolean
    EligibilityEvaluationWriteRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          description: Conjunto completo das respostas atualmente registradas; criterionId único
          items:
            $ref: '#/components/schemas/EligibilityAnswerWriteRequest'
    EligibilityEvaluation:
      type: object
      required: [studyId, candidateId, status, answers]
      properties:
        studyId:
          type: integer
          format: int64
        candidateId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/EligibilityStatus'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/EligibilityAnswer'
        evaluatedAt:
          type: string
          format: date-time
          description: Horário da última avaliação; ausente antes da primeira resposta
    ConsentDecision:
      type: string
      enum: [GRANTED, DECLINED]
    ConsentStatus:
      type: string
      description: PENDING=Não registrado; GRANTED=Concedido; DECLINED=Recusado
      enum: [PENDING, GRANTED, DECLINED]
      default: PENDING
    SimulatedConsentWriteRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ConsentDecision'
    SimulatedConsent:
      type: object
      required: [studyId, candidateId, status]
      properties:
        studyId:
          type: integer
          format: int64
        candidateId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/ConsentStatus'
        recordedAt:
          type: string
          format: date-time
          description: Horário da decisão; ausente quando status=PENDING
        recordedByUserId:
          type: integer
          format: int64
          readOnly: true
          description: >-
            Conta que registrou a decisão (o próprio candidato desde a Sprint 3);
            ausente quando status=PENDING ou em decisões anteriores à Sprint 3
    StudyInvitationSummary:
      type: object
      required: [candidateId, studyId, studyTitle, status]
      properties:
        candidateId:
          type: integer
          format: int64
          readOnly: true
          description: Candidatura da conta autenticada neste estudo
        studyId:
          type: integer
          format: int64
          readOnly: true
        studyTitle:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/CandidateStatus'
        decidedAt:
          type: string
          format: date-time
          readOnly: true
          description: Instante da decisão; ausente em CONSENT_PENDING
    StudyInvitation:
      type: object
      required: [candidateId, studyId, studyTitle, studyObjective, startDate, endDate,
                 responsibleName, plannedVisits, termText, status]
      properties:
        candidateId:
          type: integer
          format: int64
          readOnly: true
        studyId:
          type: integer
          format: int64
          readOnly: true
        studyTitle:
          type: string
          readOnly: true
        studyObjective:
          type: string
          readOnly: true
        startDate:
          type: string
          format: date
          readOnly: true
        endDate:
          type: string
          format: date
          readOnly: true
        responsibleName:
          type: string
          readOnly: true
          description: Nome do pesquisador responsável pelo estudo
        plannedVisits:
          type: array
          readOnly: true
          description: Visitas previstas do protocolo, na ordem, com suas atividades
          items:
            $ref: '#/components/schemas/PlannedVisit'
        termText:
          type: string
          readOnly: true
          description: |
            Texto fixo do termo simulado. Deve informar que o termo é fictício,
            sem valor legal, e que nenhum dado real é coletado.
        status:
          $ref: '#/components/schemas/CandidateStatus'
        decidedAt:
          type: string
          format: date-time
          readOnly: true
          description: Instante da decisão; ausente em CONSENT_PENDING
    ParticipantStudy:
      type: object
      description: |
        Estudo em que a conta autenticada participa (RF17). Quando houver
        solicitação de retirada voluntária (RF20), withdrawalRequest traz o
        pedido mais recente (ausente caso nunca tenha solicitado).
      required: [participantId, studyId, studyTitle, studyObjective, studyStatus, startDate,
                 endDate, responsibleName, participationStatus, includedAt, plannedVisits]
      properties:
        participantId:
          type: integer
          format: int64
          readOnly: true
          description: Participação da conta neste estudo
        studyId:
          type: integer
          format: int64
          readOnly: true
        studyTitle:
          type: string
          readOnly: true
        studyObjective:
          type: string
          readOnly: true
        studyStatus:
          $ref: '#/components/schemas/StudyStatus'
        startDate:
          type: string
          format: date
          readOnly: true
        endDate:
          type: string
          format: date
          readOnly: true
        responsibleName:
          type: string
          readOnly: true
          description: Nome do pesquisador responsável pelo estudo
        participationStatus:
          $ref: '#/components/schemas/ParticipantStatus'
        includedAt:
          type: string
          format: date-time
          readOnly: true
        withdrawnAt:
          type: string
          format: date-time
          readOnly: true
          description: |
            Instante da retirada; ausente quando participationStatus=ACTIVE. O
            motivo e a autoria da retirada não são expostos ao participante.
        withdrawalRequest:
          $ref: '#/components/schemas/ParticipantWithdrawalRequestView'
        plannedVisits:
          type: array
          readOnly: true
          description: Visitas previstas do protocolo, na ordem, com suas atividades; [] quando não houver
          items:
            $ref: '#/components/schemas/PlannedVisit'
    ParticipantVisit:
      type: object
      description: Visita agendada da conta autenticada (RF18)
      required: [id, studyId, studyTitle, participantId, plannedVisitId, plannedVisitName,
                 scheduledAt, status, activities]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        studyId:
          type: integer
          format: int64
          readOnly: true
        studyTitle:
          type: string
          readOnly: true
        participantId:
          type: integer
          format: int64
          readOnly: true
          description: Participação da conta no estudo da visita
        plannedVisitId:
          type: integer
          format: int64
          readOnly: true
        plannedVisitName:
          type: string
          readOnly: true
          description: Nome da visita prevista no protocolo
        scheduledAt:
          type: string
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/ScheduledVisitStatus'
        outcomeAt:
          type: string
          format: date-time
          readOnly: true
          description: Instante do desfecho; ausente em SCHEDULED
        cancellationReason:
          type: string
          readOnly: true
          description: Justificativa do cancelamento; presente só em CANCELLED
        presenceConfirmedAt:
          type: string
          format: date-time
          readOnly: true
          description: >
            Instante da confirmação de presença prevista (RF19); ausente
            enquanto o participante não confirmar. Nunca altera status=SCHEDULED.
        rescheduleRequest:
          $ref: '#/components/schemas/ParticipantRescheduleRequest'
        activities:
          type: array
          readOnly: true
          description: Atividades previstas da visita na ordem do protocolo; [] quando não houver
          items:
            $ref: '#/components/schemas/PlannedActivity'
    ParticipantVisits:
      type: object
      description: Visitas da conta autenticada separadas em próximas e histórico (RF18)
      required: [upcoming, history]
      properties:
        upcoming:
          type: array
          description: Visitas SCHEDULED, por scheduledAt crescente
          items:
            $ref: '#/components/schemas/ParticipantVisit'
        history:
          type: array
          description: Visitas DONE, ABSENT ou CANCELLED, por scheduledAt decrescente
          items:
            $ref: '#/components/schemas/ParticipantVisit'
    Participant:
      type: object
      required: [id, studyId, candidateId, candidateName, includedAt, status]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        studyId:
          type: integer
          format: int64
          readOnly: true
        candidateId:
          type: integer
          format: int64
          readOnly: true
        candidateName:
          type: string
          readOnly: true
        includedAt:
          type: string
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/ParticipantStatus'
        withdrawal:
          $ref: '#/components/schemas/ParticipantWithdrawal'
    ParticipantStatus:
      type: string
      description: ACTIVE=Ativo; WITHDRAWN=Retirado (final)
      enum: [ACTIVE, WITHDRAWN]
    ParticipantWithdrawalRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Motivo da retirada; espaços nas extremidades são removidos
    ParticipantWithdrawal:
      type: object
      description: Presente só quando status=WITHDRAWN
      required: [reason, withdrawnAt, withdrawnByUserId, cancelledVisitCount]
      properties:
        reason:
          type: string
          maxLength: 500
        withdrawnAt:
          type: string
          format: date-time
          readOnly: true
        withdrawnByUserId:
          type: integer
          format: int64
          readOnly: true
          description: Coordenador que registrou a retirada
        cancelledVisitCount:
          type: integer
          minimum: 0
          readOnly: true
          description: Quantidade de visitas futuras canceladas pela retirada
    WithdrawalRequestStatus:
      type: string
      description: |
        Situação da solicitação de retirada voluntária (RF20):
        PENDING=Aguardando efetivação pelo coordenador via RF16;
        COMPLETED=Concluída automaticamente ao efetivar a retirada em RF16 (com
        resolvedByUserId e resolvedAt);
        CANCELLED=Cancelada automaticamente pelo sistema ao encerrar (CLOSED) ou
        cancelar (CANCELLED) o estudo.
      enum: [PENDING, COMPLETED, CANCELLED]
    VoluntaryWithdrawalRequestCreate:
      type: object
      description: Pedido opcional de retirada voluntária enviado pelo participante (RF20)
      properties:
        reason:
          type: string
          maxLength: 500
          description: |
            Motivo opcional informado pelo participante; espaços nas
            extremidades são removidos e valores em branco equivalem a motivo
            não informado.
    ParticipantWithdrawalRequestView:
      type: object
      description: |
        Visão do participante sobre a solicitação de retirada voluntária mais
        recente (RF20). A autoria da resolução não é exposta ao participante.
      required: [id, participantId, studyId, status, requestedAt]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        participantId:
          type: integer
          format: int64
          readOnly: true
          description: Participação da conta autenticada no estudo
        studyId:
          type: integer
          format: int64
          readOnly: true
        status:
          $ref: '#/components/schemas/WithdrawalRequestStatus'
        reason:
          type: string
          maxLength: 500
          readOnly: true
          description: Motivo informado pelo participante, quando preenchido
        requestedAt:
          type: string
          format: date-time
          readOnly: true
          description: Instante de criação da solicitação atribuído pelo servidor
        resolvedAt:
          type: string
          format: date-time
          readOnly: true
          description: |
            Instante da conclusão (RF16) ou do cancelamento automático pelo
            ciclo de vida do estudo; ausente em PENDING.
    WithdrawalRequest:
      type: object
      description: Solicitação de retirada voluntária exibida à equipe do estudo (RF20)
      required: [id, studyId, participantId, participantName, status, requestedAt]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        studyId:
          type: integer
          format: int64
          readOnly: true
        participantId:
          type: integer
          format: int64
          readOnly: true
        participantName:
          type: string
          readOnly: true
          description: Nome do participante incluído, para exibição em listas
        status:
          $ref: '#/components/schemas/WithdrawalRequestStatus'
        reason:
          type: string
          maxLength: 500
          readOnly: true
          description: Motivo opcional informado pelo participante, quando preenchido
        requestedAt:
          type: string
          format: date-time
          readOnly: true
        resolvedByUserId:
          type: integer
          format: int64
          readOnly: true
          description: |
            Usuário que efetivou a retirada (COMPLETED) ou encerrou/cancelou o
            estudo (CANCELLED); ausente em PENDING.
        resolvedAt:
          type: string
          format: date-time
          readOnly: true
          description: Instante de conclusão ou cancelamento; ausente em PENDING
    ActivityResultWriteRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 200
          description: Valor fictício em texto livre (ex. "120x80 mmHg"); sem interpretação clínica
        note:
          type: string
          maxLength: 500
          description: Observação opcional
    ActivityResult:
      type: object
      required: [visitId, activityId, activityName, value, recordedByUserId, recordedAt]
      properties:
        visitId:
          type: integer
          format: int64
          readOnly: true
        activityId:
          type: integer
          format: int64
          readOnly: true
        activityName:
          type: string
          readOnly: true
          description: Nome atual da atividade prevista no protocolo
        value:
          type: string
          maxLength: 200
        note:
          type: string
          maxLength: 500
        recordedByUserId:
          type: integer
          format: int64
          readOnly: true
          description: Pesquisador da última gravação
        recordedAt:
          type: string
          format: date-time
          readOnly: true
          description: Instante da última gravação
    VisitResultActivity:
      type: object
      required: [activityId, name, description, position]
      properties:
        activityId:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        position:
          type: integer
          minimum: 1
          readOnly: true
          description: Ordem da atividade no protocolo
        result:
          $ref: '#/components/schemas/ActivityResult'
    VisitResults:
      type: object
      required: [visitId, plannedVisitId, plannedVisitName, status, activities]
      properties:
        visitId:
          type: integer
          format: int64
          readOnly: true
        plannedVisitId:
          type: integer
          format: int64
          readOnly: true
        plannedVisitName:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/ScheduledVisitStatus'
        activities:
          type: array
          readOnly: true
          description: Atividades na ordem do protocolo; result ausente quando ainda não registrado
          items:
            $ref: '#/components/schemas/VisitResultActivity'
    ParticipantHistoryVisit:
      description: Visita agendada com desfecho e resultados por atividade
      allOf:
        - $ref: '#/components/schemas/ScheduledVisit'
        - type: object
          required: [results]
          properties:
            results:
              type: array
              readOnly: true
              description: Resultados registrados, na ordem do protocolo; [] quando não há
              items:
                $ref: '#/components/schemas/ActivityResult'
    ParticipantHistory:
      type: object
      required: [participant, visits]
      properties:
        participant:
          $ref: '#/components/schemas/Participant'
        visits:
          type: array
          readOnly: true
          description: Visitas em ordem cronológica de scheduledAt; [] quando não há
          items:
            $ref: '#/components/schemas/ParticipantHistoryVisit'
    ScheduledVisitStatus:
      type: string
      description: |
        SCHEDULED=Agendada; DONE=Realizada; ABSENT=Ausente; CANCELLED=Cancelada.
        DONE, ABSENT e CANCELLED são finais.
      enum: [SCHEDULED, DONE, ABSENT, CANCELLED]
    VisitOutcome:
      type: string
      description: Desfecho aceito no registro; SCHEDULED não é aceito no corpo
      enum: [DONE, ABSENT, CANCELLED]
    ScheduledVisitCreateRequest:
      type: object
      required: [plannedVisitId, scheduledAt]
      properties:
        plannedVisitId:
          type: integer
          format: int64
          minimum: 1
          description: Visita prevista do protocolo do mesmo estudo
        scheduledAt:
          type: string
          format: date-time
          description: |
            Data e hora da visita, ISO 8601 com fuso (ex. 2026-11-20T09:00:00-03:00).
            Deve ser futura e cair dentro do período do estudo (dia no fuso
            America/Fortaleza).
    VisitOutcomeRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          $ref: '#/components/schemas/VisitOutcome'
        note:
          type: string
          maxLength: 500
          description: Observação opcional; obrigatória (justificativa) quando outcome=CANCELLED
    ScheduledVisit:
      type: object
      required: [id, studyId, participantId, participantName, plannedVisitId, plannedVisitName,
                 scheduledAt, status, createdByUserId, createdAt, version]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        studyId:
          type: integer
          format: int64
          readOnly: true
        participantId:
          type: integer
          format: int64
          readOnly: true
        participantName:
          type: string
          readOnly: true
          description: Nome do candidato incluído, para exibição em listas
        plannedVisitId:
          type: integer
          format: int64
        plannedVisitName:
          type: string
          readOnly: true
          description: Nome da visita prevista no momento da consulta
        scheduledAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ScheduledVisitStatus'
        createdByUserId:
          type: integer
          format: int64
          readOnly: true
          description: Coordenador que agendou
        createdAt:
          type: string
          format: date-time
          readOnly: true
        outcomeByUserId:
          type: integer
          format: int64
          readOnly: true
          description: Autor do desfecho; ausente enquanto status=SCHEDULED
        outcomeAt:
          type: string
          format: date-time
          readOnly: true
          description: Instante do desfecho; ausente enquanto status=SCHEDULED
        outcomeNote:
          type: string
          readOnly: true
          description: Observação ou justificativa do desfecho, quando houver
        presenceConfirmedAt:
          type: string
          format: date-time
          readOnly: true
          description: >
            Instante da confirmação de presença prevista pelo participante (RF19);
            ausente enquanto não confirmada ou em nova visita criada por
            reagendamento. Não altera ScheduledVisit.version.
        rescheduleRequest:
          $ref: '#/components/schemas/VisitRescheduleRequestSummary'
        version:
          type: integer
          format: int64
          readOnly: true
          description: >
            Versão para If-Match (também enviada no cabeçalho ETag); muda
            apenas em desfechos/cancelamentos, não ao confirmar presença.
    RescheduleRequestStatus:
      type: string
      description: |
        Situação da solicitação de reagendamento (RF19):
        PENDING=Aguardando análise da coordenação;
        ACCEPTED=Aceita com criação atômica de novo agendamento;
        DECLINED=Recusada com justificativa (visita original segue válida);
        CANCELLED=Cancelada automaticamente por desfecho (RF13), retirada (RF16)
        ou encerramento/cancelamento do estudo.
      enum: [PENDING, ACCEPTED, DECLINED, CANCELLED]
    RescheduleRequestDecision:
      type: string
      description: Decisão do coordenador sobre solicitação PENDING (RF19)
      enum: [ACCEPTED, DECLINED]
    VisitRescheduleRequestCreate:
      type: object
      description: Pedido de reagendamento enviado pelo participante autenticado (RF19)
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Motivo obrigatório do pedido de reagendamento (não pode ficar em branco)
        suggestedScheduledAt:
          type: string
          format: date-time
          description: |
            Data e hora sugeridas pelo participante, opcional, ISO 8601 com fuso
            (ex. 2027-03-17T14:00:00-03:00). Quando informada, deve ser futura
            e cair dentro do período do estudo no fuso America/Fortaleza.
    ParticipantRescheduleRequest:
      type: object
      description: Visão do participante sobre a solicitação de reagendamento de uma visita (RF19)
      required: [id, visitId, status, reason, createdAt]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        visitId:
          type: integer
          format: int64
          readOnly: true
          description: Identificador da visita agendada original vinculada ao pedido
        status:
          $ref: '#/components/schemas/RescheduleRequestStatus'
        reason:
          type: string
          readOnly: true
          description: Motivo informado pelo participante na abertura do pedido
        suggestedScheduledAt:
          type: string
          format: date-time
          readOnly: true
          description: Data/hora sugerida pelo participante, quando informada
        createdAt:
          type: string
          format: date-time
          readOnly: true
        decidedAt:
          type: string
          format: date-time
          readOnly: true
          description: Instante da decisão da coordenação ou do cancelamento automático; ausente em PENDING
        decisionNote:
          type: string
          readOnly: true
          description: Justificativa ou observação da decisão (obrigatória em DECLINED); ausente quando não houver
        newScheduledVisitId:
          type: integer
          format: int64
          readOnly: true
          description: Identificador da nova visita SCHEDULED criada; presente só quando status=ACCEPTED
        newScheduledAt:
          type: string
          format: date-time
          readOnly: true
          description: Data e hora da nova visita criada; presente só quando status=ACCEPTED
    VisitRescheduleRequestSummary:
      type: object
      description: Resumo da solicitação de reagendamento mais recente vinculada a uma ScheduledVisit (RF19)
      required: [id, status, reason, createdAt, version]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        status:
          $ref: '#/components/schemas/RescheduleRequestStatus'
        reason:
          type: string
          readOnly: true
        suggestedScheduledAt:
          type: string
          format: date-time
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        decidedByUserId:
          type: integer
          format: int64
          readOnly: true
          description: Coordenador que decidiu (ACCEPTED ou DECLINED); ausente em PENDING ou CANCELLED automático
        decidedAt:
          type: string
          format: date-time
          readOnly: true
          description: Instante da decisão ou do cancelamento automático; ausente em PENDING
        decisionNote:
          type: string
          readOnly: true
          description: Observação ou justificativa da decisão, quando houver
        newScheduledVisitId:
          type: integer
          format: int64
          readOnly: true
          description: Identificador da nova visita SCHEDULED criada; presente só em ACCEPTED
        newScheduledAt:
          type: string
          format: date-time
          readOnly: true
          description: Data/hora da nova visita criada; presente só em ACCEPTED
        version:
          type: integer
          format: int64
          readOnly: true
          description: Versão da solicitação para envio em If-Match ao decidir o pedido
    VisitRescheduleRequest:
      type: object
      description: Solicitação de reagendamento exibida à equipe do estudo (RF19)
      required: [id, studyId, participantId, participantName, visitId, plannedVisitId,
                 plannedVisitName, originalScheduledAt, status, reason,
                 requestedByUserId, createdAt, version]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        studyId:
          type: integer
          format: int64
          readOnly: true
        participantId:
          type: integer
          format: int64
          readOnly: true
        participantName:
          type: string
          readOnly: true
        visitId:
          type: integer
          format: int64
          readOnly: true
          description: Identificador da visita agendada original
        plannedVisitId:
          type: integer
          format: int64
          readOnly: true
        plannedVisitName:
          type: string
          readOnly: true
        originalScheduledAt:
          type: string
          format: date-time
          readOnly: true
          description: Data/hora originalmente agendada da visita vinculada
        status:
          $ref: '#/components/schemas/RescheduleRequestStatus'
        reason:
          type: string
          readOnly: true
        suggestedScheduledAt:
          type: string
          format: date-time
          readOnly: true
        requestedByUserId:
          type: integer
          format: int64
          readOnly: true
          description: Usuário PARTICIPANT que abriu a solicitação
        createdAt:
          type: string
          format: date-time
          readOnly: true
        decidedByUserId:
          type: integer
          format: int64
          readOnly: true
          description: Coordenador que decidiu (ACCEPTED ou DECLINED); ausente em PENDING ou CANCELLED automático
        decidedAt:
          type: string
          format: date-time
          readOnly: true
          description: Instante da decisão ou do cancelamento automático; ausente em PENDING
        decisionNote:
          type: string
          readOnly: true
          description: Observação do aceite ou justificativa obrigatória da recusa
        newScheduledVisitId:
          type: integer
          format: int64
          readOnly: true
          description: Identificador da nova visita SCHEDULED criada; presente só em ACCEPTED
        newScheduledAt:
          type: string
          format: date-time
          readOnly: true
          description: Data/hora da nova visita criada; presente só em ACCEPTED
        version:
          type: integer
          format: int64
          readOnly: true
          description: Versão para If-Match na decisão; também enviada no cabeçalho ETag
    RescheduleRequestDecisionRequest:
      type: object
      description: Decisão do coordenador sobre solicitação PENDING (RF19)
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/RescheduleRequestDecision'
        newScheduledAt:
          type: string
          format: date-time
          description: |
            Nova data e hora da visita, ISO 8601 com fuso. Obrigatória quando
            decision=ACCEPTED; deve ser futura e estar dentro do período do
            estudo (dia no fuso America/Fortaleza). Deve ficar ausente em
            DECLINED (seu envio responde 400 RESCHEDULE_NEW_DATE_NOT_ALLOWED).
        note:
          type: string
          maxLength: 500
          description: |
            Observação opcional em ACCEPTED; justificativa obrigatória (não
            pode ficar em branco após trim) quando decision=DECLINED.
    RescheduleRequestDecisionResponse:
      type: object
      description: |
        Resultado da decisão sobre solicitação de reagendamento (RF19): traz a
        solicitação atualizada, a visita original atualizada (CANCELLED em
        ACCEPTED; SCHEDULED em DECLINED) e a nova visita SCHEDULED quando aceita.
      required: [request, originalVisit]
      properties:
        request:
          $ref: '#/components/schemas/VisitRescheduleRequest'
        originalVisit:
          $ref: '#/components/schemas/ScheduledVisit'
        newVisit:
          $ref: '#/components/schemas/ScheduledVisit'
    StudyCounts:
      type: object
      description: Quantitativo consolidado de estudos por situação (RF21)
      required: [total, planning, recruitment, execution, closed, cancelled]
      properties:
        total:
          type: integer
          minimum: 0
          readOnly: true
        planning:
          type: integer
          minimum: 0
          readOnly: true
        recruitment:
          type: integer
          minimum: 0
          readOnly: true
        execution:
          type: integer
          minimum: 0
          readOnly: true
        closed:
          type: integer
          minimum: 0
          readOnly: true
        cancelled:
          type: integer
          minimum: 0
          readOnly: true
    CandidateStatusCounts:
      type: object
      description: Distribuição de candidaturas pelos sete valores de CandidateStatus (RF21/RF22)
      required: [invited, active, consentPending, granted, declined, included, cancelled]
      properties:
        invited:
          type: integer
          minimum: 0
          readOnly: true
        active:
          type: integer
          minimum: 0
          readOnly: true
        consentPending:
          type: integer
          minimum: 0
          readOnly: true
        granted:
          type: integer
          minimum: 0
          readOnly: true
        declined:
          type: integer
          minimum: 0
          readOnly: true
        included:
          type: integer
          minimum: 0
          readOnly: true
        cancelled:
          type: integer
          minimum: 0
          readOnly: true
    EligibilityStatusCounts:
      type: object
      description: |
        Contagem de elegibilidade apenas das candidaturas não canceladas
        (status != CANCELLED), garantindo soma igual a total - cancelled (RF21/RF22).
      required: [pending, eligible, ineligible]
      properties:
        pending:
          type: integer
          minimum: 0
          readOnly: true
        eligible:
          type: integer
          minimum: 0
          readOnly: true
        ineligible:
          type: integer
          minimum: 0
          readOnly: true
    CandidateMetrics:
      type: object
      description: Métricas compartilhadas de candidaturas e pessoas distintas (RF21/RF22)
      required: [total, distinctPeople, byStatus, byEligibility]
      properties:
        total:
          type: integer
          minimum: 0
          readOnly: true
          description: Total de candidaturas no escopo (soma de byStatus)
        distinctPeople:
          type: integer
          minimum: 0
          readOnly: true
          description: Pessoas distintas (userId únicos) entre as candidaturas do escopo
        byStatus:
          $ref: '#/components/schemas/CandidateStatusCounts'
        byEligibility:
          $ref: '#/components/schemas/EligibilityStatusCounts'
    ParticipantMetrics:
      type: object
      description: |
        Métricas compartilhadas de participantes incluídos (RF21/RF22).
        total = active + withdrawn (vagas ocupadas); distinctPeople conta
        contas únicas incluídas no escopo.
      required: [total, active, withdrawn, distinctPeople]
      properties:
        total:
          type: integer
          minimum: 0
          readOnly: true
        active:
          type: integer
          minimum: 0
          readOnly: true
        withdrawn:
          type: integer
          minimum: 0
          readOnly: true
        distinctPeople:
          type: integer
          minimum: 0
          readOnly: true
    VisitMetrics:
      type: object
      description: |
        Métricas compartilhadas de visitas agendadas (RF21/RF22).
        total = done + absent + cancelled + pending; overduePending é o
        subconjunto de pending com scheduledAt <= generatedAt.
      required: [total, done, absent, cancelled, pending, overduePending]
      properties:
        total:
          type: integer
          minimum: 0
          readOnly: true
        done:
          type: integer
          minimum: 0
          readOnly: true
        absent:
          type: integer
          minimum: 0
          readOnly: true
        cancelled:
          type: integer
          minimum: 0
          readOnly: true
        pending:
          type: integer
          minimum: 0
          readOnly: true
        overduePending:
          type: integer
          minimum: 0
          readOnly: true
    MonitoringSummary:
      type: object
      description: Bloco consolidado do painel de acompanhamento (RF21)
      required: [studies, candidates, participants, visits]
      properties:
        studies:
          $ref: '#/components/schemas/StudyCounts'
        candidates:
          $ref: '#/components/schemas/CandidateMetrics'
        participants:
          $ref: '#/components/schemas/ParticipantMetrics'
        visits:
          $ref: '#/components/schemas/VisitMetrics'
    StudyMonitoringMetrics:
      type: object
      description: Métricas detalhadas de um estudo no painel de acompanhamento (RF21)
      required: [studyId, studyTitle, studyStatus, startDate, endDate, participantLimit,
                 candidates, participants, visits]
      properties:
        studyId:
          type: integer
          format: int64
          readOnly: true
        studyTitle:
          type: string
          readOnly: true
        studyStatus:
          $ref: '#/components/schemas/StudyStatus'
        startDate:
          type: string
          format: date
          readOnly: true
        endDate:
          type: string
          format: date
          readOnly: true
        participantLimit:
          type: integer
          minimum: 1
          readOnly: true
        candidates:
          $ref: '#/components/schemas/CandidateMetrics'
        participants:
          $ref: '#/components/schemas/ParticipantMetrics'
        visits:
          $ref: '#/components/schemas/VisitMetrics'
    MonitoringDashboard:
      type: object
      description: Painel real de acompanhamento gerencial (RF21)
      required: [generatedAt, summary, studies]
      properties:
        generatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Instante de geração da fotografia de métricas
        studyId:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          description: Identificador do estudo filtrado, quando informado em query
        summary:
          $ref: '#/components/schemas/MonitoringSummary'
        studies:
          type: array
          readOnly: true
          description: Lista ordenada por studyId crescente; [] quando não houver estudos
          items:
            $ref: '#/components/schemas/StudyMonitoringMetrics'
    StudyReport:
      type: object
      description: |
        Relatório simplificado agregado de um estudo (RF22), sem listagem
        nominal de participantes ou candidatos e com exatamente as mesmas
        definições matemáticas de RF21.
      required: [generatedAt, studyId, studyTitle, studyStatus, studyStartDate,
                 studyEndDate, participantLimit, candidates, participants, visits]
      properties:
        generatedAt:
          type: string
          format: date-time
          readOnly: true
        studyId:
          type: integer
          format: int64
          readOnly: true
        studyTitle:
          type: string
          readOnly: true
        studyStatus:
          $ref: '#/components/schemas/StudyStatus'
        studyStartDate:
          type: string
          format: date
          readOnly: true
        studyEndDate:
          type: string
          format: date
          readOnly: true
        participantLimit:
          type: integer
          minimum: 1
          readOnly: true
        filterStartDate:
          type: string
          format: date
          readOnly: true
          description: Data inicial aplicada ao filtro de período, quando informada
        filterEndDate:
          type: string
          format: date
          readOnly: true
          description: Data final aplicada ao filtro de período, quando informada
        candidates:
          $ref: '#/components/schemas/CandidateMetrics'
        participants:
          $ref: '#/components/schemas/ParticipantMetrics'
        visits:
          $ref: '#/components/schemas/VisitMetrics'
    PatientAccountStatus:
      type: string
      description: |
        Situação derivada da conta PARTICIPANT (Backlog 2.2 a 2.4):
        ACTIVE=Conta ativada;
        PENDING_ACTIVATION=Nunca ativada, com convite ainda válido;
        EXPIRED=Nunca ativada, com convite vencido ou ausente (elegível ao arquivamento);
        ARCHIVED=Conta nunca ativada arquivada logicamente;
        DEACTIVATED=Conta desativada pelo coordenador.
      enum: [ACTIVE, PENDING_ACTIVATION, EXPIRED, ARCHIVED, DEACTIVATED]
    PatientStudySummary:
      type: object
      description: |
        Resumo de candidatura e eventual participação da conta em um estudo
        clínico; participantId e participationStatus estão presentes quando
        houve inclusão (candidateStatus=INCLUDED).
      required: [studyId, studyTitle, studyStatus, candidateId, candidateStatus]
      properties:
        studyId:
          type: integer
          format: int64
          readOnly: true
        studyTitle:
          type: string
          readOnly: true
        studyStatus:
          $ref: '#/components/schemas/StudyStatus'
        candidateId:
          type: integer
          format: int64
          readOnly: true
        candidateStatus:
          $ref: '#/components/schemas/CandidateStatus'
        participantId:
          type: integer
          format: int64
          readOnly: true
          description: Identificador da participação quando já incluído no estudo
        participationStatus:
          $ref: '#/components/schemas/ParticipantStatus'
    PatientAccount:
      type: object
      description: |
        Conta de paciente/candidato exibida ao coordenador em /api/patients
        (Backlog 2.2 a 2.4), com situação derivada e histórico por estudo.
      required: [userId, name, email, accountStatus, hasActiveParticipation, studies]
      properties:
        userId:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        accountStatus:
          $ref: '#/components/schemas/PatientAccountStatus'
        hasActiveParticipation:
          type: boolean
          readOnly: true
          description: Indica se possui participação ACTIVE em ao menos um estudo (impede desativação direta)
        activationExpiresAt:
          type: string
          format: date-time
          readOnly: true
          description: Expiração do último convite pendente; presente em PENDING_ACTIVATION ou EXPIRED
        archivedAt:
          type: string
          format: date-time
          readOnly: true
          description: Instante do arquivamento lógico; presente só quando accountStatus=ARCHIVED
        studies:
          type: array
          readOnly: true
          description: Histórico completo de candidaturas/participações por estudo (inclui CANCELLED), ordenado por studyId e candidateId crescentes; [] quando não houver
          items:
            $ref: '#/components/schemas/PatientStudySummary'
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Código estável para identificar o tipo de erro
        message:
          type: string
          description: Mensagem legível para pessoas
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ProblemDetail:
      type: object
      description: Erro de validação, recurso ausente ou conflito retornado pelo Spring
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: |
            Código estável da regra violada (ex. VISIT_ALREADY_SCHEDULED).
            Presente nos erros de regra de negócio da Release 2; os erros da
            Release 1 podem não trazê-lo.
          example: VISIT_ALREADY_SCHEDULED
  responses:
    BadRequest:
      description: Requisição inválida ou regra de validação não atendida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Token ausente ou inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: |
        Perfil sem permissão para a operação. Casos com code próprio:
        PASSWORD_CHANGE_REQUIRED (sessão com mustChangePassword=true) e
        CONSENT_DECIDED_BY_CANDIDATE (rota descontinuada de consentimento do coordenador).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Estado atual ou restrição de negócio impede a operação
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
