  /api/studies/{studyId}/candidates:
    parameters:
      - $ref: '#/components/parameters/StudyId'
    get:
      tags: [Candidatos]
      summary: Lista candidatos vinculados ao estudo (RF08, T12.1)
      description: |
        Leitura por COORDINATOR ou pelo RESEARCHER indicado como responsável do
        estudo. Um pesquisador não responsável recebe 403. A filtragem é feita
        pelo studyId da rota; não mistura candidatos de estudos diferentes.
        Candidaturas canceladas (status=CANCELLED) só aparecem com
        includeCancelled=true. Retorna [] quando o estudo não tem candidatos.
      security:
        - bearerAuth: []
      parameters:
        - name: includeCancelled
          in: query
          required: false
          description: Inclui as candidaturas canceladas na lista
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Candidatos do estudo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candidate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Candidatos]
      summary: Cadastra um candidato no estudo (RF08, T12.1)
      description: |
        Somente COORDINATOR. studyId vem da rota, não do JSON. name, age, email e
        phone são obrigatórios; age é inteiro entre 1 e 130 anos. O cadastro
        inicia com eligibilityStatus=PENDING. A elegibilidade para participar
        depende dos critérios de cada estudo, além da validade da idade no
        cadastro. O estudo precisa estar em RECRUITMENT.

        O e-mail identifica a conta do candidato (sem diferença de maiúsculas):
        - E-mail sem conta: cria uma conta PARTICIPANT inativa e um código de
          ativação de uso único, válido por 72 horas. status=INVITED e a
          resposta traz activation.activationCode.
        - E-mail de conta PARTICIPANT ainda não ativada (convidada por outro
          estudo): gera um novo código, e o anterior deixa de valer.
          status=INVITED, com activation.activationCode.
        - E-mail de conta PARTICIPANT ativa: apenas vincula, sem duplicar a conta
          e sem código. status=ACTIVE.
        A criação do candidato e da conta/código é atômica.

        Regras e erros:
        - 409 CANDIDATE_ALREADY_IN_STUDY: a mesma conta (e-mail) já tem uma
          candidatura não cancelada neste estudo. Candidaturas CANCELLED não
          contam, então a pessoa pode ser cadastrada de novo. Substitui o
          critério da Release 1 (nome + idade).
        - 409 EMAIL_BELONGS_TO_STAFF: o e-mail pertence a uma conta RESEARCHER,
          COORDINATOR ou ADMINISTRATOR; nada é vinculado nem criado.
        - 409 PARTICIPANT_ACCOUNT_DEACTIVATED: a conta PARTICIPANT do e-mail foi
          desativada pelo administrador.
        - 409 STUDY_NOT_RECRUITING: estudo fora de RECRUITMENT.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateCreateRequest'
            example:
              name: Ana Souza
              age: 42
              email: ana.souza@exemplo.test
              phone: '(83) 99999-0000'
      responses:
        '201':
          description: Candidato cadastrado
          headers:
            Location:
              schema:
                type: string
              description: Caminho do candidato criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidate'
              example:
                id: 14
                studyId: 2
                name: Ana Souza
                age: 42
                email: ana.souza@exemplo.test
                phone: '(83) 99999-0000'
                userId: 31
                status: INVITED
                eligibilityStatus: PENDING
                consentStatus: PENDING
                activation:
                  expiresAt: '2026-11-15T14:30:00-03:00'
                  expired: false
                  activationCode: K7Q2-9MXA
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/studies/{studyId}/candidates/{candidateId}:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/CandidateId'
    get:
      tags: [Candidatos]
      summary: Consulta um candidato do estudo
      description: |
        Leitura por COORDINATOR ou pelo RESEARCHER indicado como responsável do
        estudo. Um pesquisador não responsável recebe 403. O candidato deve
        pertencer ao estudo da rota.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Candidato encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/studies/{studyId}/candidates/{candidateId}/cancellation:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/CandidateId'
    post:
      tags: [Candidatos]
      summary: Cancela a candidatura antes da inclusão (T17.2)
      description: |
        Somente COORDINATOR. Para corrigir um cadastro errado (por exemplo,
        e-mail digitado errado) ou registrar a desistência antes da inclusão.
        Não apaga dados: a candidatura passa a status=CANCELLED, com motivo,
        autor e instante, e as respostas de elegibilidade e a decisão de
        consentimento já registradas são preservadas. Após a inclusão, a saída
        do estudo é a retirada do participante (RF16).

        Efeitos:
        - A candidatura sai da lista padrão do estudo e dos convites do
          candidato no app (/api/me/invitations).
        - Avaliação de elegibilidade (PUT .../eligibility), decisão do candidato
          (POST /api/me/invitations/{candidateId}/decision), inclusão e novo
          código de ativação dessa candidatura passam a responder 409
          CANDIDATE_CANCELLED. As consultas (GET) continuam disponíveis ao
          coordenador, para preservar o histórico.
        - Se a conta ainda não foi ativada e não tem outra candidatura não
          cancelada, o código de ativação pendente deixa de valer. A conta
          continua inativa, sem ser apagada.

        Regras e erros:
        - 409 CANDIDATE_ALREADY_INCLUDED: o candidato já é participante; use a
          retirada (RF16).
        - 409 CANDIDATE_ALREADY_CANCELLED: a candidatura já estava cancelada.
        - 409 STUDY_NOT_RECRUITING: estudo fora de RECRUITMENT.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateCancellationRequest'
            example:
              reason: E-mail cadastrado com erro de digitação
      responses:
        '200':
          description: Candidatura cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Candidate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/studies/{studyId}/candidates/{candidateId}/activation-code:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/CandidateId'
    post:
      tags: [Candidatos]
      summary: Gera um novo código de ativação para o candidato (T17.1)
      description: |
        Somente COORDINATOR. Para candidato com status=INVITED, com código
        pendente ou vencido. Gera um código novo, válido por 72 horas, e o
        anterior deixa de valer imediatamente. Como a conta é única por e-mail,
        o novo código vale para todos os estudos em que a conta é candidata.

        Regras e erros:
        - 409 CANDIDATE_ALREADY_ACTIVE: a conta do candidato já foi ativada.
        - 409 CANDIDATE_CANCELLED: a candidatura foi cancelada.
        - 409 STUDY_NOT_RECRUITING: estudo fora de RECRUITMENT.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Novo código gerado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateActivation'
              example:
                expiresAt: '2026-11-16T09:00:00-03:00'
                expired: false
                activationCode: R4WN-2T8C
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/studies/{studyId}/candidates/{candidateId}/eligibility:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/CandidateId'
    get:
      tags: [Elegibilidade]
      summary: Consulta respostas e resultado da elegibilidade (RF09, T13.1)
      description: |
        Somente COORDINATOR. Antes da avaliação, retorna status PENDING e answers=[].
        O candidato deve pertencer ao estudo da rota.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Avaliação atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityEvaluation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Elegibilidade]
      summary: Registra ou substitui as respostas dos critérios (RF09, T13.1)
      description: |
        Somente COORDINATOR. O corpo contém o conjunto completo das respostas
        registradas até agora; cada criterionId deve pertencer ao estudo e aparecer
        uma vez. Respostas ausentes mantêm o resultado PENDING. Sem critérios no
        estudo não há conclusão de elegibilidade. Com todos respondidos, o
        candidato é ELIGIBLE se todos os INCLUSION tiverem matches=true e todos
        os EXCLUSION tiverem matches=false; caso contrário é INELIGIBLE. Após
        inclusão do candidato, novas avaliações respondem 409. Avaliar estudo
        sem critérios também responde 409. Candidatura cancelada responde 409
        CANDIDATE_CANCELLED.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EligibilityEvaluationWriteRequest'
            example:
              answers:
                - criterionId: 1
                  matches: true
                - criterionId: 2
                  matches: false
      responses:
        '200':
          description: Respostas e resultado recalculado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityEvaluation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/studies/{studyId}/candidates/{candidateId}/consent:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/CandidateId'
    get:
      tags: [Consentimento]
      summary: Consulta o consentimento simulado (RF10, T14.1)
      description: |
        Somente COORDINATOR, apenas leitura. Mostra a decisão registrada pelo
        próprio candidato no aplicativo (POST /api/me/invitations/{candidateId}/decision).
        Antes da decisão, retorna status PENDING sem recordedAt.
        Não representa assinatura ou documento de consentimento real.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Situação do consentimento simulado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatedConsent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Consentimento]
      deprecated: true
      summary: Descontinuada — o coordenador não registra mais o consentimento (T17.1)
      description: |
        Descontinuada na Sprint 3 por decisão da professora: a decisão de
        consentimento passou ao candidato autenticado, em
        POST /api/me/invitations/{candidateId}/decision. Esta rota responde 403
        com code CONSENT_DECIDED_BY_CANDIDATE para qualquer perfil e não altera
        nenhum dado.
      security:
        - bearerAuth: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/studies/{studyId}/candidates/{candidateId}/inclusion:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/CandidateId'
    post:
      tags: [Participantes]
      summary: Inclui candidato como participante (RF11, T15.1)
      description: |
        Somente COORDINATOR. Exige estudo em RECRUITMENT, candidato do estudo
        com eligibilityStatus=ELIGIBLE e consentimento simulado GRANTED. O
        candidato só pode ser incluído uma vez no estudo. A inclusão verifica
        participantLimit de forma atômica (participantes retirados continuam
        ocupando a vaga, por decisão da PO): duas requisições pela última vaga
        não podem criar dois participantes. Condição não atendida retorna 409
        sem gravação parcial. Candidatura cancelada responde 409
        CANDIDATE_CANCELLED.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Participante incluído
          headers:
            Location:
              schema:
                type: string
              description: Caminho do participante criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/studies/{studyId}/participants:
    parameters:
      - $ref: '#/components/parameters/StudyId'
    get:
      tags: [Participantes]
      summary: Lista participantes incluídos no estudo (RF11, T15.1)
      description: |
        RESEARCHER ou COORDINATOR. Inclui participantes retirados, identificados
        por status=WITHDRAWN. Retorna [] quando não há participantes.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Participantes do estudo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Participant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/studies/{studyId}/participants/{participantId}:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/ParticipantId'
    get:
      tags: [Participantes]
      summary: Consulta um participante do estudo
      description: RESEARCHER ou COORDINATOR. O participante deve pertencer ao estudo.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Participante encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/studies/{studyId}/participants/{participantId}/history:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/ParticipantId'
    get:
      tags: [Participantes]
      summary: Consulta o histórico do participante (RF15, T20.1)
      description: |
        Somente leitura. RESEARCHER ou COORDINATOR; outros perfis recebem 403.
        Participante de outro estudo, ou inexistente, responde 404.

        Reúne em uma consulta a situação do participante (ativo ou retirado), a
        inclusão, a retirada (quando houver) e as visitas agendadas em ordem
        cronológica de scheduledAt, cada uma com o desfecho e os resultados por
        atividade. Visitas canceladas pela retirada aparecem como CANCELLED.
        Participante sem visitas retorna visits=[], não erro.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Histórico do participante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/studies/{studyId}/participants/{participantId}/withdrawal:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/ParticipantId'
    post:
      tags: [Participantes]
      summary: Registra a retirada do participante (RF16, T20.1)
      description: |
        Somente COORDINATOR. Motivo obrigatório; data e autor são gravados pelo
        backend. Em uma única operação atômica:
        - o participante passa a status=WITHDRAWN;
        - as visitas SCHEDULED com scheduledAt posterior ao instante da retirada
          passam a CANCELLED, com outcomeNote "Retirada do participante", o
          mesmo autor e instante, e version incrementada (um desfecho enviado
          depois com a versão antiga recebe 409 VERSION_MISMATCH ou
          VISIT_OUTCOME_FINAL);
        - novos agendamentos passam a responder 409 PARTICIPANT_WITHDRAWN.
        Se o cancelamento das visitas falhar, a retirada não é gravada.

        Visitas SCHEDULED já vencidas continuam aguardando desfecho, e visitas
        realizadas antes da retirada continuam aceitando resultados (RF14). A
        vaga não volta ao estudo e o participante não pode ser reincluído
        (decisão da PO).

        Regras e erros:
        - 400: reason ausente ou em branco.
        - 409 PARTICIPANT_ALREADY_WITHDRAWN: o participante já foi retirado.
        - 409 STUDY_READ_ONLY: estudo em CLOSED ou CANCELLED.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantWithdrawalRequest'
            example:
              reason: Participante informou que não pode mais comparecer às visitas
      responses:
        '200':
          description: Retirada registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
              example:
                id: 4
                studyId: 1
                candidateId: 14
                candidateName: Ana Souza
                includedAt: '2026-11-13T10:00:00-03:00'
                status: WITHDRAWN
                withdrawal:
                  reason: Participante informou que não pode mais comparecer às visitas
                  withdrawnAt: '2026-11-21T15:20:00-03:00'
                  withdrawnByUserId: 2
                  cancelledVisitCount: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/studies/{studyId}/visits:
    parameters:
      - $ref: '#/components/parameters/StudyId'
    get:
      tags: [Visitas agendadas]
      summary: Lista as visitas agendadas do estudo (RF12/RF13, T18.1)
      description: |
        RESEARCHER ou COORDINATOR. Inclui visitas de participantes retirados.
        Ordenação por scheduledAt crescente. Retorna [] quando não há registros.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra pela situação da visita
          schema:
            $ref: '#/components/schemas/ScheduledVisitStatus'
        - name: participantId
          in: query
          required: false
          description: Filtra pelas visitas de um participante do estudo
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Visitas agendadas do estudo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduledVisit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/studies/{studyId}/participants/{participantId}/visits:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/ParticipantId'
    get:
      tags: [Visitas agendadas]
      summary: Lista as visitas agendadas de um participante (RF12, T18.1)
      description: |
        RESEARCHER ou COORDINATOR. O participante deve pertencer ao estudo.
        Ordenação por scheduledAt crescente. Retorna [] quando não há registros.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Visitas agendadas do participante
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduledVisit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Visitas agendadas]
      summary: Agenda uma visita prevista para o participante (RF12, T18.1)
      description: |
        Somente COORDINATOR. Cria a visita com status SCHEDULED e version 0.

        Regras e erros:
        - 400 PLANNED_VISIT_NOT_IN_STUDY: plannedVisitId não pertence ao estudo da rota.
        - 400 VISIT_DATE_NOT_FUTURE: scheduledAt não é posterior ao instante atual.
        - 400 VISIT_DATE_OUTSIDE_STUDY_PERIOD: a data de scheduledAt está fora
          do período do estudo (startDate a endDate, inclusive). A data é o dia
          de scheduledAt no fuso America/Fortaleza, qualquer que seja o offset
          enviado, para que o mesmo instante tenha sempre a mesma resposta.
        - 409 STUDY_STATUS_DOES_NOT_ALLOW_SCHEDULING: estudo fora de RECRUITMENT
          ou EXECUTION (PLANNING, CLOSED e CANCELLED recusam).
        - 409 PARTICIPANT_WITHDRAWN: participante retirado (RF16).
        - 409 VISIT_ALREADY_SCHEDULED: o participante já tem visita SCHEDULED ou
          DONE para a mesma visita prevista. Visitas ABSENT ou CANCELLED não
          impedem um novo agendamento.

        Não há rota para remarcar: para mudar a data, registre o desfecho
        CANCELLED com justificativa e agende de novo.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledVisitCreateRequest'
            example:
              plannedVisitId: 3
              scheduledAt: '2026-11-20T09:00:00-03:00'
      responses:
        '201':
          description: Visita agendada
          headers:
            Location:
              schema:
                type: string
              description: Caminho da visita agendada criada
            ETag:
              schema:
                type: string
              description: Versão da visita para enviar em If-Match ao registrar o desfecho
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledVisit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/studies/{studyId}/participants/{participantId}/visits/{visitId}:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/ParticipantId'
      - $ref: '#/components/parameters/VisitId'
    get:
      tags: [Visitas agendadas]
      summary: Consulta uma visita agendada (RF12/RF13, T18.1)
      description: |
        RESEARCHER ou COORDINATOR. A visita deve pertencer ao participante e
        ao estudo da rota.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Visita agendada encontrada
          headers:
            ETag:
              schema:
                type: string
              description: Versão da visita para enviar em If-Match ao registrar o desfecho
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledVisit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/studies/{studyId}/participants/{participantId}/visits/{visitId}/outcome:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/ParticipantId'
      - $ref: '#/components/parameters/VisitId'
    post:
      tags: [Visitas agendadas]
      parameters:
        - $ref: '#/components/parameters/VisitVersion'
      summary: Registra o desfecho de uma visita agendada (RF13, T18.1)
      description: |
        Somente COORDINATOR. Transições permitidas: SCHEDULED para DONE, ABSENT
        ou CANCELLED. DONE, ABSENT e CANCELLED são finais e não mudam. Grava
        autor e instante e incrementa version.

        Regras e erros:
        - 400 CANCELLATION_REASON_REQUIRED: outcome=CANCELLED sem note preenchida.
        - 409 VERSION_MISMATCH: If-Match diferente da version atual da visita.
          Em duas requisições concorrentes, uma é aceita e a outra recebe 409.
        - 409 VISIT_OUTCOME_FINAL: a visita já está em DONE, ABSENT ou CANCELLED.
        - 409 STUDY_READ_ONLY: estudo em CLOSED ou CANCELLED.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitOutcomeRequest'
            examples:
              realizada:
                value:
                  outcome: DONE
              cancelada:
                value:
                  outcome: CANCELLED
                  note: Participante pediu para remarcar
      responses:
        '200':
          description: Desfecho registrado
          headers:
            ETag:
              schema:
                type: string
              description: Nova versão da visita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledVisit'
              example:
                id: 12
                studyId: 1
                participantId: 4
                participantName: Ana Souza
                plannedVisitId: 3
                plannedVisitName: Avaliação inicial
                scheduledAt: '2026-11-20T09:00:00-03:00'
                status: DONE
                createdByUserId: 2
                createdAt: '2026-11-13T14:30:00-03:00'
                outcomeByUserId: 2
                outcomeAt: '2026-11-20T10:05:00-03:00'
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/studies/{studyId}/participants/{participantId}/visits/{visitId}/results:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/ParticipantId'
      - $ref: '#/components/parameters/VisitId'
    get:
      tags: [Resultados]
      summary: Consulta os resultados da visita por atividade (RF14, T20.1)
      description: |
        RESEARCHER ou COORDINATOR. Lista as atividades da visita prevista
        correspondente, na ordem do protocolo, cada uma com o resultado
        registrado ou result ausente. Funciona para visitas em qualquer
        situação; só visitas DONE aceitam registro. Visita que não pertence
        ao participante e ao estudo da rota responde 404.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Atividades da visita com os resultados registrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitResults'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/studies/{studyId}/participants/{participantId}/visits/{visitId}/results/{activityId}:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/ParticipantId'
      - $ref: '#/components/parameters/VisitId'
      - $ref: '#/components/parameters/ActivityId'
    put:
      tags: [Resultados]
      summary: Registra ou atualiza o resultado de uma atividade (RF14, T20.1)
      description: |
        Somente o RESEARCHER responsável pelo estudo; COORDINATOR e pesquisador
        não responsável recebem 403. Registra (201) ou substitui (200) o
        resultado fictício de uma atividade da visita. A substituição é
        completa: note omitida na atualização apaga a observação anterior.
        Valores são texto livre, fictícios e sem interpretação clínica; não há
        cálculo automático. Grava autor e instante da última gravação.

        Regras e erros:
        - 400: value ausente ou em branco.
        - 404: visita que não pertence ao participante e ao estudo da rota, ou
          activityId que não pertence à visita prevista desta visita agendada.
        - 409 VISIT_NOT_DONE: a visita não está em DONE (agendada, ausente ou
          cancelada).
        - 409 STUDY_READ_ONLY: estudo em CLOSED ou CANCELLED.
        A retirada do participante não bloqueia resultados de visitas
        realizadas antes dela.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityResultWriteRequest'
            example:
              value: 120x80 mmHg
              note: Medida após 5 minutos em repouso
      responses:
        '200':
          description: Resultado atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResult'
        '201':
          description: Resultado registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/me/invitations:
    get:
      tags: [Convites do participante]
      summary: Lista os convites de estudo do candidato autenticado (T17.1)
      description: |
        Somente PARTICIPANT; outros perfis recebem 403. O candidato vem do token,
        nunca de parâmetro. Lista as candidaturas da própria conta com status
        CONSENT_PENDING, GRANTED ou DECLINED, da mais recente para a mais antiga.
        Candidaturas INVITED, ACTIVE (ainda sem elegibilidade concluída como
        ELIGIBLE) e INCLUDED não aparecem; estudos com inclusão ficam nas rotas
        do participante da T23.1. Retorna [] quando não há convites.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra pela situação; CONSENT_PENDING lista só os convites aguardando decisão
          schema:
            type: string
            enum: [CONSENT_PENDING, GRANTED, DECLINED]
      responses:
        '200':
          description: Convites do candidato
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudyInvitationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/me/invitations/{candidateId}:
    parameters:
      - $ref: '#/components/parameters/CandidateId'
    get:
      tags: [Convites do participante]
      summary: Consulta o convite com os dados do estudo e o termo simulado (T17.1)
      description: |
        Somente PARTICIPANT. Mostra o que o app exibe antes da decisão: título,
        objetivo, período e pesquisador responsável do estudo, visitas previstas
        com atividades e o texto fixo do termo simulado. Candidatura de outra
        conta, ou que não esteja em CONSENT_PENDING, GRANTED ou DECLINED,
        responde 404, sem revelar sua existência.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Convite encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyInvitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/me/invitations/{candidateId}/decision:
    parameters:
      - $ref: '#/components/parameters/CandidateId'
    post:
      tags: [Convites do participante]
      summary: Registra o aceite ou a recusa do termo simulado (RF10, T17.1)
      description: |
        Somente PARTICIPANT, dono da candidatura. Única rota que registra a
        decisão de consentimento. A decisão é registrada uma única vez, com
        autoria e instante; não há troca posterior. Com GRANTED, o coordenador
        pode incluir o candidato (RF11); com DECLINED, a inclusão fica bloqueada.

        Regras e erros:
        - 400: status ausente ou diferente de GRANTED e DECLINED.
        - 404: candidatura de outra conta ou inexistente.
        - 409 CONSENT_ALREADY_DECIDED: a decisão já foi registrada.
        - 409 CANDIDATE_CANCELLED: a candidatura foi cancelada pelo coordenador
          (por exemplo, enquanto o convite estava aberto no app). Tem prioridade
          sobre CONSENT_NOT_AVAILABLE.
        - 409 CONSENT_NOT_AVAILABLE: a candidatura não está em CONSENT_PENDING
          (elegibilidade não concluída como ELIGIBLE, ou candidato já incluído).
        - 409 STUDY_NOT_RECRUITING: estudo fora de RECRUITMENT.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatedConsentWriteRequest'
            example:
              status: GRANTED
      responses:
        '200':
          description: Decisão registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyInvitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: Identificador BIGINT do usuário
      schema:
        type: integer
        format: int64
        minimum: 1
    StudyId:
      name: studyId
      in: path
      required: true
      description: Identificador BIGINT do estudo
      schema:
        type: integer
        format: int64
        minimum: 1
    StudyVersion:
      name: If-Match
      in: header
      required: true
      description: |
        ETag forte com Study.version entre aspas, por exemplo "0".
        Divergência responde 409.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    CriterionId:
      name: criterionId
      in: path
      required: true
      description: Identificador BIGINT do critério
      schema:
        type: integer
        format: int64
        minimum: 1
    PlannedVisitId:
      name: plannedVisitId
      in: path
      required: true
      description: Identificador BIGINT da visita prevista
      schema:
        type: integer
        format: int64
        minimum: 1
    CandidateId:
      name: candidateId
      in: path
      required: true
      description: Identificador BIGINT do candidato
      schema:
        type: integer
        format: int64
        minimum: 1
    ParticipantId:
      name: participantId
      in: path
      required: true
      description: Identificador BIGINT do participante
      schema:
        type: integer
        format: int64
        minimum: 1
    VisitId:
      name: visitId
      in: path
      required: true
      description: Identificador BIGINT da visita agendada
      schema:
        type: integer
        format: int64
        minimum: 1
    VisitVersion:
      name: If-Match
      in: header
      required: true
      description: |
        ETag forte com ScheduledVisit.version entre aspas, por exemplo "0".
        É a versão da visita agendada, não a do estudo. Divergência responde 409.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    ActivityId:
      name: activityId
      in: path
      required: true
      description: Identificador BIGINT da atividade da visita prevista
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    UserRole:
      type: string
      description: Perfil de acesso do usuário
      enum: [RESEARCHER, COORDINATOR, ADMINISTRATOR, PARTICIPANT]
    UserCreateRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 255
          description: Deve ser único
        password:
          type: string
          writeOnly: true
          description: Senha de entrada; o backend deve armazenar somente o hash BCrypt
        role:
          $ref: '#/components/schemas/UserRole'
    UserUpdateRequest:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 255
          description: Deve permanecer único
        role:
          $ref: '#/components/schemas/UserRole'
    User:
      type: object
      required: [id, name, email, role, active]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 255
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
        mustChangePassword:
          type: boolean
          readOnly: true
          default: false
          description: |
            true na sessão aberta pela ativação do candidato, até a senha ser
            definida em PUT /api/auth/password. Enquanto true, só a troca de
            senha e o logout são aceitos.
    ActivationRequest:
      type: object
      required: [email, activationCode]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        activationCode:
          type: string
          minLength: 1
          maxLength: 32
          writeOnly: true
          description: Código de uso único exibido ao coordenador no cadastro do candidato
    PasswordChangeRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          writeOnly: true
          description: Obrigatória quando mustChangePassword=false
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          pattern: '^(?=.*[A-Za-z])(?=.*[0-9]).{8,72}$'
          writeOnly: true
          description: 8 a 72 caracteres, com ao menos uma letra e um número
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: JWT para as chamadas autenticadas
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          format: int64
          description: Validade do token em segundos
        user:
          $ref: '#/components/schemas/User'
    StudyWriteRequest:
      type: object
      required: [title, objective, responsibleUserId, startDate, endDate, participantLimit]
      properties:
        title:
          type: string
          maxLength: 200
        objective:
          type: string
        responsibleUserId:
          type: integer
          format: int64
          minimum: 1
          description: Referência a um usuário responsável existente e ativo
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Deve ser igual ou posterior a startDate
        participantLimit:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
    Study:
      type: object
      required: [id, title, objective, responsibleUserId, startDate, endDate, participantLimit, status, version]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
          maxLength: 200
        objective:
          type: string
        responsibleUserId:
          type: integer
          format: int64
          minimum: 1
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        participantLimit:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
        status:
          $ref: '#/components/schemas/StudyStatus'
        version:
          type: integer
          format: int64
          readOnly: true
    StudyStatus:
      type: string
      description: |
        PLANNING=Planejamento; RECRUITMENT=Recrutamento;
        EXECUTION=Em execução; CLOSED=Encerrado; CANCELLED=Cancelado.
      enum: [PLANNING, RECRUITMENT, EXECUTION, CLOSED, CANCELLED]
      default: PLANNING
    StudyStatusChangeRequest:
      type: object
      required: [status, expectedStatus]
      properties:
        status:
          $ref: '#/components/schemas/StudyStatus'
        expectedStatus:
          $ref: '#/components/schemas/StudyStatus'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Obrigatória quando status é CANCELLED
    StudyStatusHistory:
      type: object
      required: [id, actorUserId, changedAt, fromStatus, toStatus]
      properties:
        id:
          type: integer
          format: int64
        actorUserId:
          type: integer
          format: int64
        changedAt:
          type: string
          format: date-time
        fromStatus:
          $ref: '#/components/schemas/StudyStatus'
        toStatus:
          $ref: '#/components/schemas/StudyStatus'
        reason:
          type: string
    CriterionType:
      type: string
      description: Critério de inclusão ou exclusão
      enum: [INCLUSION, EXCLUSION]
    StudyCriterionWriteRequest:
      type: object
      required: [type, description]
      properties:
        type:
          $ref: '#/components/schemas/CriterionType'
        description:
          type: string
          minLength: 1
          maxLength: 500
    StudyCriterion:
      type: object
      required: [id, studyId, type, description]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        studyId:
          type: integer
          format: int64
          readOnly: true
        type:
          $ref: '#/components/schemas/CriterionType'
        description:
          type: string
          maxLength: 500
    PlannedActivityWriteRequest:
      type: object
      required: [name, description]
      properties:
        id:
          type: integer
          format: int64
          description: ID existente para preservar a atividade em uma edição
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 500
    PlannedActivity:
      type: object
      required: [id, name, description, position]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 500
        position:
          type: integer
          minimum: 1
    PlannedVisitWriteRequest:
      type: object
      required: [name, plannedDate, activities]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        plannedDate:
          type: string
          format: date
          description: Data prevista dentro do período do estudo
        position:
          type: integer
          minimum: 1
          description: Posição de inserção; nula para anexar ao fim
        activities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PlannedActivityWriteRequest'
    PlannedVisit:
      type: object
      required: [id, studyId, name, plannedDate, position, activities]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        studyId:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          maxLength: 120
        plannedDate:
          type: string
          format: date
        position:
          type: integer
          minimum: 1
        activities:
          type: array
          items:
            $ref: '#/components/schemas/PlannedActivity'
    PlannedVisitOrderRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
    CandidateCreateRequest:
      type: object
      required: [name, age, email, phone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        age:
          type: integer
          format: int32
          minimum: 1
          maximum: 130
          description: Idade informada no cadastro; elegibilidade depende dos critérios do estudo
        email:
          type: string
          format: email
          maxLength: 255
          description: Identifica a conta PARTICIPANT do candidato; comparação sem diferença de maiúsculas
        phone:
          type: string
          minLength: 8
          maxLength: 20
          pattern: '^\+?[0-9 ()-]{8,20}$'
          description: Telefone fictício com DDD; aceita dígitos, espaço, parênteses, hífen e + inicial
    CandidateStatus:
      type: string
      description: |
        Andamento do candidato no fluxo de identidade e consentimento, calculado
        pelo backend. Não substitui eligibilityStatus, que segue separado.
        - INVITED=Convidado: conta criada, aguardando o primeiro acesso.
        - ACTIVE=Conta ativa: conta ativa, elegibilidade ainda não ELIGIBLE.
        - CONSENT_PENDING=Aguardando decisão: conta ativa e ELIGIBLE, sem decisão;
          o convite aparece no app.
        - GRANTED=Aceitou: o candidato aceitou o termo simulado.
        - DECLINED=Recusou: o candidato recusou o termo simulado.
        - INCLUDED=Incluído: o coordenador incluiu o candidato como participante.
        - CANCELLED=Cancelado: o coordenador cancelou a candidatura antes da
          inclusão. É final; a pessoa pode ser cadastrada de novo no estudo.
      enum: [INVITED, ACTIVE, CONSENT_PENDING, GRANTED, DECLINED, INCLUDED, CANCELLED]
    CandidateCancellationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Motivo do cancelamento; espaços nas extremidades são removidos
    CandidateActivation:
      type: object
      required: [expiresAt, expired]
      properties:
        expiresAt:
          type: string
          format: date-time
          description: Emissão do código + 72 horas
        expired:
          type: boolean
          description: true quando o prazo passou; o coordenador pode gerar um novo código
        activationCode:
          type: string
          readOnly: true
          description: |
            Somente demonstração (Sprint 3): exibido ao coordenador enquanto não
            há envio por e-mail. Aparece apenas nas respostas do cadastro do
            candidato e de geração de novo código, no momento em que o código é
            gerado; nenhuma consulta posterior o devolve. Será removido quando o
            código passar a ser enviado ao candidato. Não deve ser guardado nem
            registrado em log.
    Candidate:
      type: object
      required: [id, studyId, name, age, email, phone, userId, status, eligibilityStatus, consentStatus]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        studyId:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          maxLength: 120
        age:
          type: integer
          format: int32
          minimum: 1
          maximum: 130
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          maxLength: 20
        userId:
          type: integer
          format: int64
          readOnly: true
          description: Conta PARTICIPANT vinculada ao candidato
        status:
          $ref: '#/components/schemas/CandidateStatus'
        eligibilityStatus:
          $ref: '#/components/schemas/EligibilityStatus'
        consentStatus:
          $ref: '#/components/schemas/ConsentStatus'
        activation:
          $ref: '#/components/schemas/CandidateActivation'
        cancellation:
          $ref: '#/components/schemas/CandidateCancellation'
    CandidateCancellation:
      type: object
      description: Presente só quando status=CANCELLED
      required: [reason, cancelledAt, cancelledByUserId]
      properties:
        reason:
          type: string
          maxLength: 500
        cancelledAt:
          type: string
          format: date-time
          readOnly: true
        cancelledByUserId:
          type: integer
          format: int64
          readOnly: true
    EligibilityStatus:
      type: string
      description: PENDING=Pendente; ELIGIBLE=Elegível; INELIGIBLE=Não elegível
      enum: [PENDING, ELIGIBLE, INELIGIBLE]
      default: PENDING
    EligibilityAnswerWriteRequest:
      type: object
      required: [criterionId, matches]
      properties:
        criterionId:
          type: integer
          format: int64
          minimum: 1
        matches:
          type: boolean
          description: Indica se a condição descrita no critério se aplica ao candidato
    EligibilityAnswer:
      type: object
      required: [criterionId, matches]
      properties:
        criterionId:
          type: integer
          format: int64
        matches:
          type: boolean
    EligibilityEvaluationWriteRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          description: Conjunto completo das respostas atualmente registradas; criterionId único
          items:
            $ref: '#/components/schemas/EligibilityAnswerWriteRequest'
    EligibilityEvaluation:
      type: object
      required: [studyId, candidateId, status, answers]
      properties:
        studyId:
          type: integer
          format: int64
        candidateId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/EligibilityStatus'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/EligibilityAnswer'
        evaluatedAt:
          type: string
          format: date-time
          description: Horário da última avaliação; ausente antes da primeira resposta
    ConsentDecision:
      type: string
      enum: [GRANTED, DECLINED]
    ConsentStatus:
      type: string
      description: PENDING=Não registrado; GRANTED=Concedido; DECLINED=Recusado
      enum: [PENDING, GRANTED, DECLINED]
      default: PENDING
    SimulatedConsentWriteRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ConsentDecision'
    SimulatedConsent:
      type: object
      required: [studyId, candidateId, status]
      properties:
        studyId:
          type: integer
          format: int64
        candidateId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/ConsentStatus'
        recordedAt:
          type: string
          format: date-time
          description: Horário da decisão; ausente quando status=PENDING
        recordedByUserId:
          type: integer
          format: int64
          readOnly: true
          description: Conta que registrou a decisão (o próprio candidato desde a Sprint 3); ausente quando status=PENDING
    StudyInvitationSummary:
      type: object
      required: [candidateId, studyId, studyTitle, status]
      properties:
        candidateId:
          type: integer
          format: int64
          readOnly: true
          description: Candidatura da conta autenticada neste estudo
        studyId:
          type: integer
          format: int64
          readOnly: true
        studyTitle:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/CandidateStatus'
        decidedAt:
          type: string
          format: date-time
          readOnly: true
          description: Instante da decisão; ausente em CONSENT_PENDING
    StudyInvitation:
      type: object
      required: [candidateId, studyId, studyTitle, studyObjective, startDate, endDate,
                 responsibleName, plannedVisits, termText, status]
      properties:
        candidateId:
          type: integer
          format: int64
          readOnly: true
        studyId:
          type: integer
          format: int64
          readOnly: true
        studyTitle:
          type: string
          readOnly: true
        studyObjective:
          type: string
          readOnly: true
        startDate:
          type: string
          format: date
          readOnly: true
        endDate:
          type: string
          format: date
          readOnly: true
        responsibleName:
          type: string
          readOnly: true
          description: Nome do pesquisador responsável pelo estudo
        plannedVisits:
          type: array
          readOnly: true
          description: Visitas previstas do protocolo, na ordem, com suas atividades
          items:
            $ref: '#/components/schemas/PlannedVisit'
        termText:
          type: string
          readOnly: true
          description: |
            Texto fixo do termo simulado. Deve informar que o termo é fictício,
            sem valor legal, e que nenhum dado real é coletado.
        status:
          $ref: '#/components/schemas/CandidateStatus'
        decidedAt:
          type: string
          format: date-time
          readOnly: true
          description: Instante da decisão; ausente em CONSENT_PENDING
    Participant:
      type: object
      required: [id, studyId, candidateId, candidateName, includedAt, status]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        studyId:
          type: integer
          format: int64
          readOnly: true
        candidateId:
          type: integer
          format: int64
          readOnly: true
        candidateName:
          type: string
          readOnly: true
        includedAt:
          type: string
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/ParticipantStatus'
        withdrawal:
          $ref: '#/components/schemas/ParticipantWithdrawal'
    ParticipantStatus:
      type: string
      description: ACTIVE=Ativo; WITHDRAWN=Retirado (final)
      enum: [ACTIVE, WITHDRAWN]
    ParticipantWithdrawalRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Motivo da retirada; espaços nas extremidades são removidos
    ParticipantWithdrawal:
      type: object
      description: Presente só quando status=WITHDRAWN
      required: [reason, withdrawnAt, withdrawnByUserId, cancelledVisitCount]
      properties:
        reason:
          type: string
          maxLength: 500
        withdrawnAt:
          type: string
          format: date-time
          readOnly: true
        withdrawnByUserId:
          type: integer
          format: int64
          readOnly: true
          description: Coordenador que registrou a retirada
        cancelledVisitCount:
          type: integer
          minimum: 0
          readOnly: true
          description: Quantidade de visitas futuras canceladas pela retirada
    ActivityResultWriteRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 200
          description: Valor fictício em texto livre (ex. "120x80 mmHg"); sem interpretação clínica
        note:
          type: string
          maxLength: 500
          description: Observação opcional
    ActivityResult:
      type: object
      required: [visitId, activityId, value, recordedByUserId, recordedAt]
      properties:
        visitId:
          type: integer
          format: int64
          readOnly: true
        activityId:
          type: integer
          format: int64
          readOnly: true
        value:
          type: string
          maxLength: 200
        note:
          type: string
          maxLength: 500
        recordedByUserId:
          type: integer
          format: int64
          readOnly: true
          description: Pesquisador da última gravação
        recordedAt:
          type: string
          format: date-time
          readOnly: true
          description: Instante da última gravação
    VisitResultActivity:
      type: object
      required: [activityId, name, description, position]
      properties:
        activityId:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        position:
          type: integer
          minimum: 1
          readOnly: true
          description: Ordem da atividade no protocolo
        result:
          $ref: '#/components/schemas/ActivityResult'
    VisitResults:
      type: object
      required: [visitId, plannedVisitId, plannedVisitName, status, activities]
      properties:
        visitId:
          type: integer
          format: int64
          readOnly: true
        plannedVisitId:
          type: integer
          format: int64
          readOnly: true
        plannedVisitName:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/ScheduledVisitStatus'
        activities:
          type: array
          readOnly: true
          description: Atividades na ordem do protocolo; result ausente quando ainda não registrado
          items:
            $ref: '#/components/schemas/VisitResultActivity'
    ParticipantHistoryVisit:
      description: Visita agendada com desfecho e resultados por atividade
      allOf:
        - $ref: '#/components/schemas/ScheduledVisit'
        - type: object
          required: [results]
          properties:
            results:
              type: array
              readOnly: true
              description: Resultados registrados, na ordem do protocolo; [] quando não há
              items:
                $ref: '#/components/schemas/ActivityResult'
    ParticipantHistory:
      type: object
      required: [participant, visits]
      properties:
        participant:
          $ref: '#/components/schemas/Participant'
        visits:
          type: array
          readOnly: true
          description: Visitas em ordem cronológica de scheduledAt; [] quando não há
          items:
            $ref: '#/components/schemas/ParticipantHistoryVisit'
    ScheduledVisitStatus:
      type: string
      description: |
        SCHEDULED=Agendada; DONE=Realizada; ABSENT=Ausente; CANCELLED=Cancelada.
        DONE, ABSENT e CANCELLED são finais.
      enum: [SCHEDULED, DONE, ABSENT, CANCELLED]
    VisitOutcome:
      type: string
      description: Desfecho aceito no registro; SCHEDULED não é aceito no corpo
      enum: [DONE, ABSENT, CANCELLED]
    ScheduledVisitCreateRequest:
      type: object
      required: [plannedVisitId, scheduledAt]
      properties:
        plannedVisitId:
          type: integer
          format: int64
          minimum: 1
          description: Visita prevista do protocolo do mesmo estudo
        scheduledAt:
          type: string
          format: date-time
          description: |
            Data e hora da visita, ISO 8601 com fuso (ex. 2026-11-20T09:00:00-03:00).
            Deve ser futura e cair dentro do período do estudo (dia no fuso
            America/Fortaleza).
    VisitOutcomeRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          $ref: '#/components/schemas/VisitOutcome'
        note:
          type: string
          maxLength: 500
          description: Observação opcional; obrigatória (justificativa) quando outcome=CANCELLED
    ScheduledVisit:
      type: object
      required: [id, studyId, participantId, participantName, plannedVisitId, plannedVisitName,
                 scheduledAt, status, createdByUserId, createdAt, version]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        studyId:
          type: integer
          format: int64
          readOnly: true
        participantId:
          type: integer
          format: int64
          readOnly: true
        participantName:
          type: string
          readOnly: true
          description: Nome do candidato incluído, para exibição em listas
        plannedVisitId:
          type: integer
          format: int64
        plannedVisitName:
          type: string
          readOnly: true
          description: Nome da visita prevista no momento da consulta
        scheduledAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ScheduledVisitStatus'
        createdByUserId:
          type: integer
          format: int64
          readOnly: true
          description: Coordenador que agendou
        createdAt:
          type: string
          format: date-time
          readOnly: true
        outcomeByUserId:
          type: integer
          format: int64
          readOnly: true
          description: Autor do desfecho; ausente enquanto status=SCHEDULED
        outcomeAt:
          type: string
          format: date-time
          readOnly: true
          description: Instante do desfecho; ausente enquanto status=SCHEDULED
        outcomeNote:
          type: string
          readOnly: true
          description: Observação ou justificativa do desfecho, quando houver
        version:
          type: integer
          format: int64
          readOnly: true
          description: Versão para If-Match; também enviada no cabeçalho ETag
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Código estável para identificar o tipo de erro
        message:
          type: string
          description: Mensagem legível para pessoas
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ProblemDetail:
      type: object
      description: Erro de validação, recurso ausente ou conflito retornado pelo Spring
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: |
            Código estável da regra violada (ex. VISIT_ALREADY_SCHEDULED).
            Presente nos erros de regra de negócio da Release 2; os erros da
            Release 1 podem não trazê-lo.
          example: VISIT_ALREADY_SCHEDULED
  responses:
    BadRequest:
      description: Requisição inválida ou regra de validação não atendida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Token ausente ou inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: |
        Perfil sem permissão para a operação. Casos com code próprio:
        PASSWORD_CHANGE_REQUIRED (sessão com mustChangePassword=true) e
        CONSENT_DECIDED_BY_CANDIDATE (rota descontinuada de consentimento do coordenador).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Estado atual ou restrição de negócio impede a operação
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
