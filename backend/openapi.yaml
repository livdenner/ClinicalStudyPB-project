  /api/studies/{studyId}/participants/{participantId}/history:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/ParticipantId'
    get:
      tags: [Participantes]
      summary: Consulta o histórico do participante (RF15, T20.1, T21.1)
      description: |
        Somente leitura. RESEARCHER ou COORDINATOR; outros perfis recebem 403.
        Participante de outro estudo, ou inexistente, responde 404.

        Reúne em uma consulta a situação do participante (ativo ou retirado), a
        inclusão, a retirada (quando houver) e as visitas agendadas em ordem
        cronológica de scheduledAt (empate pelo id da visita), cada uma com o
        desfecho e os resultados por atividade na ordem do protocolo. Visitas
        canceladas pela retirada aparecem como CANCELLED. Participante sem
        visitas retorna visits=[], e visita sem resultado traz results=[]; nenhum
        dos dois é erro. Sem paginação: a lista é limitada às visitas do
        protocolo agendadas para o participante. Os dados vêm dos registros de
        inclusão, retirada, agendamento, desfecho e resultado, sem cópia.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Histórico do participante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantHistory'
              example:
                participant:
                  id: 12
                  studyId: 3
                  candidateId: 41
                  candidateName: Ana Souza
                  includedAt: '2026-11-10T13:00:00Z'
                  status: WITHDRAWN
                  withdrawal:
                    reason: Mudou de cidade
                    withdrawnAt: '2026-12-01T12:00:00Z'
                    withdrawnByUserId: 2
                    cancelledVisitCount: 1
                visits:
                  - id: 101
                    studyId: 3
                    participantId: 12
                    participantName: Ana Souza
                    plannedVisitId: 7
                    plannedVisitName: Avaliação inicial
                    scheduledAt: '2026-11-20T12:00:00Z'
                    status: DONE
                    createdByUserId: 2
                    createdAt: '2026-11-11T12:00:00Z'
                    outcomeByUserId: 2
                    outcomeAt: '2026-11-20T13:00:00Z'
                    version: 1
                    results:
                      - visitId: 101
                        activityId: 15
                        value: 120x80 mmHg
                        note: Medida após 5 minutos em repouso
                        recordedByUserId: 1
                        recordedAt: '2026-11-20T14:00:00Z'
                  - id: 102
                    studyId: 3
                    participantId: 12
                    participantName: Ana Souza
                    plannedVisitId: 8
                    plannedVisitName: Retorno
                    scheduledAt: '2026-12-15T12:00:00Z'
                    status: CANCELLED
                    createdByUserId: 2
                    createdAt: '2026-11-21T12:00:00Z'
                    outcomeByUserId: 2
                    outcomeAt: '2026-12-01T12:00:00Z'
                    outcomeNote: Retirada do participante
                    version: 1
                    results: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/studies/{studyId}/participants/{participantId}/withdrawal:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/ParticipantId'
    post:
      tags: [Participantes]
      summary: Registra a retirada do participante (RF16, T20.1)
      description: |
        Somente COORDINATOR. Motivo obrigatório; data e autor são gravados pelo
        backend. Em uma única operação atômica:
        - o participante passa a status=WITHDRAWN;
        - as visitas SCHEDULED com scheduledAt posterior ao instante da retirada
          passam a CANCELLED, com outcomeNote "Retirada do participante", o
          mesmo autor e instante, e version incrementada (um desfecho enviado
          depois com a versão antiga recebe 409 VERSION_MISMATCH ou
          VISIT_OUTCOME_FINAL); eventuais solicitações de reagendamento PENDING
          das visitas afetadas (ou do participante retirado) passam
          automaticamente a CANCELLED (RF19);
        - eventual solicitação de retirada voluntária PENDING (RF20) desse
          participante passa automaticamente a COMPLETED, gravando
          resolvedByUserId e resolvedAt na mesma transação (seja a saída
          iniciada diretamente pelo coordenador ou a partir do pedido no app;
          não existe recusa para retirada voluntária);
        - novos agendamentos passam a responder 409 PARTICIPANT_WITHDRAWN.
        Se o cancelamento das visitas falhar, a retirada não é gravada.

        Quando houver solicitação prévia com motivo informado pelo participante,
        a interface web pode pré-preencher esse motivo em reason ao efetivar a
        retirada (ou registrar justificativa informada pela coordenação caso o
        participante não tenha enviado motivo). Visitas SCHEDULED já vencidas
        continuam aguardando desfecho, e visitas realizadas antes da retirada
        continuam aceitando resultados (RF14). A vaga não volta ao estudo e o
        participante não pode ser reincluído (decisão da PO).

        Regras e erros:
        - 400: reason ausente ou em branco.
        - 409 PARTICIPANT_ALREADY_WITHDRAWN: o participante já foi retirado.
        - 409 STUDY_READ_ONLY: estudo em CLOSED ou CANCELLED.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantWithdrawalRequest'
            example:
              reason: Participante informou que não pode mais comparecer às visitas
      responses:
        '200':
          description: Retirada registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
              example:
                id: 4
                studyId: 1
                candidateId: 14
                candidateName: Ana Souza
                includedAt: '2026-11-13T10:00:00-03:00'
                status: WITHDRAWN
                withdrawal:
                  reason: Participante informou que não pode mais comparecer às visitas
                  withdrawnAt: '2026-11-21T15:20:00-03:00'
                  withdrawnByUserId: 2
                  cancelledVisitCount: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/studies/{studyId}/withdrawal-requests:
    parameters:
      - $ref: '#/components/parameters/StudyId'
    get:
      tags: [Participantes]
      summary: Lista as solicitações de retirada voluntária do estudo (RF20, T29.1)
      description: |
        RESEARCHER ou COORDINATOR; PARTICIPANT e ADMINISTRATOR recebem 403.
        RESEARCHER consulta em modo somente leitura; COORDINATOR usa a lista
        para efetivar a saída pela rota existente de RF16
        (POST /api/studies/{studyId}/participants/{participantId}/withdrawal),
        pois não existe ação de recusa para retirada voluntária.
        Ordenação: solicitações PENDING primeiro (por requestedAt crescente,
        atendimento FIFO) e demais (COMPLETED, CANCELLED) por requestedAt
        decrescente, com desempate por id. Retorna [] quando não há registros
        para os filtros aplicados; estudo inexistente responde 404.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra pela situação da solicitação (PENDING, COMPLETED ou CANCELLED)
          schema:
            $ref: '#/components/schemas/WithdrawalRequestStatus'
        - name: participantId
          in: query
          required: false
          description: Filtra pelas solicitações de um participante do estudo
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Solicitações de retirada voluntária do estudo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WithdrawalRequest'
              example:
                - id: 3
                  studyId: 2
                  participantId: 5
                  participantName: Carlos Lima
                  status: PENDING
                  reason: Mudança de cidade impede comparecimento às próximas visitas
                  requestedAt: '2026-11-26T12:30:00Z'
                - id: 2
                  studyId: 2
                  participantId: 4
                  participantName: Ana Souza
                  status: COMPLETED
                  reason: Indisponibilidade de horários no semestre
                  requestedAt: '2026-11-20T14:00:00Z'
                  resolvedByUserId: 2
                  resolvedAt: '2026-11-21T15:20:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/studies/{studyId}/visits:
    parameters:
      - $ref: '#/components/parameters/StudyId'
    get:
      tags: [Visitas agendadas]
      summary: Lista as visitas agendadas do estudo (RF12/RF13, T18.1)
      description: |
        RESEARCHER ou COORDINATOR. Inclui visitas de participantes retirados.
        Ordenação por scheduledAt crescente. Retorna [] quando não há registros.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra pela situação da visita
          schema:
            $ref: '#/components/schemas/ScheduledVisitStatus'
        - name: participantId
          in: query
          required: false
          description: Filtra pelas visitas de um participante do estudo
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Visitas agendadas do estudo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduledVisit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/studies/{studyId}/participants/{participantId}/visits:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/ParticipantId'
    get:
      tags: [Visitas agendadas]
      summary: Lista as visitas agendadas de um participante (RF12, T18.1)
      description: |
        RESEARCHER ou COORDINATOR. O participante deve pertencer ao estudo.
        Ordenação por scheduledAt crescente. Retorna [] quando não há registros.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Visitas agendadas do participante
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduledVisit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Visitas agendadas]
      summary: Agenda uma visita prevista para o participante (RF12, T18.1)
      description: |
        Somente COORDINATOR. Cria a visita com status SCHEDULED e version 0.

        Regras e erros:
        - 400 PLANNED_VISIT_NOT_IN_STUDY: plannedVisitId não pertence ao estudo da rota.
        - 400 VISIT_DATE_NOT_FUTURE: scheduledAt não é posterior ao instante atual.
        - 400 VISIT_DATE_OUTSIDE_STUDY_PERIOD: a data de scheduledAt está fora
          do período do estudo (startDate a endDate, inclusive). A data é o dia
          de scheduledAt no fuso America/Fortaleza, qualquer que seja o offset
          enviado, para que o mesmo instante tenha sempre a mesma resposta.
        - 409 STUDY_STATUS_DOES_NOT_ALLOW_SCHEDULING: estudo fora de RECRUITMENT
          ou EXECUTION (PLANNING, CLOSED e CANCELLED recusam).
        - 409 PARTICIPANT_WITHDRAWN: participante retirado (RF16).
        - 409 VISIT_ALREADY_SCHEDULED: o participante já tem visita SCHEDULED ou
          DONE para a mesma visita prevista. Visitas ABSENT ou CANCELLED não
          impedem um novo agendamento.

        Para remarcar diretamente sem solicitação do participante, registre o
        desfecho CANCELLED com justificativa e agende de novo. Quando houver
        solicitação de reagendamento pelo aplicativo (RF19), o aceite em
        POST /api/studies/{studyId}/reschedule-requests/{requestId}/decision
        cancela a visita atual e cria o novo agendamento atomicamente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduledVisitCreateRequest'
            example:
              plannedVisitId: 3
              scheduledAt: '2026-11-20T09:00:00-03:00'
      responses:
        '201':
          description: Visita agendada
          headers:
            Location:
              schema:
                type: string
              description: Caminho da visita agendada criada
            ETag:
              schema:
                type: string
              description: Versão da visita para enviar em If-Match ao registrar o desfecho
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledVisit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/studies/{studyId}/participants/{participantId}/visits/{visitId}:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/ParticipantId'
      - $ref: '#/components/parameters/VisitId'
    get:
      tags: [Visitas agendadas]
      summary: Consulta uma visita agendada (RF12/RF13, T18.1)
      description: |
        RESEARCHER ou COORDINATOR. A visita deve pertencer ao participante e
        ao estudo da rota.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Visita agendada encontrada
          headers:
            ETag:
              schema:
                type: string
              description: Versão da visita para enviar em If-Match ao registrar o desfecho
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledVisit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/studies/{studyId}/participants/{participantId}/visits/{visitId}/outcome:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/ParticipantId'
      - $ref: '#/components/parameters/VisitId'
    post:
      tags: [Visitas agendadas]
      parameters:
        - $ref: '#/components/parameters/VisitVersion'
      summary: Registra o desfecho de uma visita agendada (RF13, T18.1)
      description: |
        Somente COORDINATOR. Transições permitidas: SCHEDULED para DONE, ABSENT
        ou CANCELLED. DONE, ABSENT e CANCELLED são finais e não mudam. Grava
        autor e instante e incrementa version. Se a visita possuir solicitação
        de reagendamento PENDING (RF19), o registro de desfecho marca essa
        solicitação automaticamente como CANCELLED.

        Regras e erros:
        - 400 CANCELLATION_REASON_REQUIRED: outcome=CANCELLED sem note preenchida.
        - 409 VERSION_MISMATCH: If-Match diferente da version atual da visita.
          Em duas requisições concorrentes, uma é aceita e a outra recebe 409.
        - 409 VISIT_OUTCOME_FINAL: a visita já está em DONE, ABSENT ou CANCELLED.
        - 409 STUDY_READ_ONLY: estudo em CLOSED ou CANCELLED.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitOutcomeRequest'
            examples:
              realizada:
                value:
                  outcome: DONE
              cancelada:
                value:
                  outcome: CANCELLED
                  note: Participante pediu para remarcar
      responses:
        '200':
          description: Desfecho registrado
          headers:
            ETag:
              schema:
                type: string
              description: Nova versão da visita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledVisit'
              example:
                id: 12
                studyId: 1
                participantId: 4
                participantName: Ana Souza
                plannedVisitId: 3
                plannedVisitName: Avaliação inicial
                scheduledAt: '2026-11-20T09:00:00-03:00'
                status: DONE
                createdByUserId: 2
                createdAt: '2026-11-13T14:30:00-03:00'
                outcomeByUserId: 2
                outcomeAt: '2026-11-20T10:05:00-03:00'
                version: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/studies/{studyId}/reschedule-requests:
    parameters:
      - $ref: '#/components/parameters/StudyId'
    get:
      tags: [Visitas agendadas]
      summary: Lista as solicitações de reagendamento do estudo (RF19, T28.1)
      description: |
        RESEARCHER ou COORDINATOR; PARTICIPANT e ADMINISTRATOR recebem 403.
        Inclui solicitações de participantes retirados posteriormente (cujos
        pedidos abertos passam a CANCELLED). Ordenação: PENDING primeiro (da
        mais antiga para a mais recente para atendimento FIFO) e demais por
        createdAt decrescente, com desempate por id. Retorna [] quando não há
        registros para os filtros aplicados; estudo inexistente responde 404.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra pela situação da solicitação (PENDING, ACCEPTED, DECLINED ou CANCELLED)
          schema:
            $ref: '#/components/schemas/RescheduleRequestStatus'
        - name: participantId
          in: query
          required: false
          description: Filtra pelas solicitações de um participante do estudo
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Solicitações de reagendamento do estudo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitRescheduleRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/studies/{studyId}/reschedule-requests/{requestId}/decision:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/RescheduleRequestId'
    post:
      tags: [Visitas agendadas]
      parameters:
        - $ref: '#/components/parameters/RescheduleRequestVersion'
      summary: Aceita ou recusa uma solicitação de reagendamento (RF19, T28.1)
      description: |
        Somente COORDINATOR; RESEARCHER, PARTICIPANT e ADMINISTRATOR recebem 403.
        Usa travamento otimista por If-Match (VisitRescheduleRequest.version) e
        bloqueio pessimista na ordem estudo -> participante -> visita para
        evitar decisões duplicadas ou corrida com desfecho (RF13) e retirada
        (RF16).

        Comportamento por decisão:
        - ACCEPTED: exige newScheduledAt futura dentro do período do estudo
          (fuso America/Fortaleza); note é opcional. Na mesma transação:
          (1) marca a visita original SCHEDULED como CANCELLED com justificativa
          de reagendamento aceito e atualiza sua version; (2) cria nova visita
          SCHEDULED para a mesma plannedVisitId com version=0 e sem herdar
          presenceConfirmedAt; (3) atualiza a solicitação para ACCEPTED com
          newScheduledVisitId, newScheduledAt, autoria, instante e version+1.
        - DECLINED: exige note preenchida após trim (justificativa obrigatória);
          newScheduledAt não deve ser informada (seu envio responde 400
          RESCHEDULE_NEW_DATE_NOT_ALLOWED). Mantém a visita original SCHEDULED
          inalterada (incluindo eventual presenceConfirmedAt) e atualiza a
          solicitação para DECLINED com decisionNote, autoria, instante e
          version+1.

        Regras e erros (em ordem de avaliação após validar formato e escopo):
        - 400 INVALID_IF_MATCH: cabeçalho If-Match ausente, vazio ou diferente
          do formato "<número>".
        - 400: decision ausente ou diferente de ACCEPTED e DECLINED, ou
          observação maior que 500 caracteres.
        - 400 RESCHEDULE_NEW_DATE_REQUIRED: decision=ACCEPTED sem newScheduledAt.
        - 400 RESCHEDULE_NEW_DATE_NOT_ALLOWED: newScheduledAt informada com
          decision=DECLINED.
        - 400 VISIT_DATE_NOT_FUTURE: newScheduledAt não é posterior ao instante atual.
        - 400 VISIT_DATE_OUTSIDE_STUDY_PERIOD: data de newScheduledAt (fuso
          America/Fortaleza) fora de startDate a endDate do estudo.
        - 400 RESCHEDULE_DECISION_NOTE_REQUIRED: decision=DECLINED sem note
          preenchida após trim.
        - 404: estudo ou solicitação inexistente, ou solicitação pertencente a
          outro estudo.
        - 409 VERSION_MISMATCH: If-Match diferente da version atual da solicitação.
        - 409 STUDY_READ_ONLY: estudo em CLOSED ou CANCELLED.
        - 409 STUDY_STATUS_DOES_NOT_ALLOW_SCHEDULING: decision=ACCEPTED com
          estudo em PLANNING (criar novo agendamento exige RECRUITMENT ou
          EXECUTION, conforme RF12); decision=DECLINED continua permitida em
          PLANNING.
        - 409 PARTICIPANT_WITHDRAWN: participante retirado (RF16).
        - 409 RESCHEDULE_REQUEST_NOT_PENDING: a solicitação já está em ACCEPTED,
          DECLINED ou CANCELLED.
        - 409 VISIT_OUTCOME_FINAL: a visita original não está mais em SCHEDULED.
        - 409 VISIT_ALREADY_SCHEDULED: o participante já possui outra visita
          SCHEDULED ou DONE para a mesma visita prevista (desconsiderando a
          própria visita original cancelada atomicamente no ACCEPTED).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequestDecisionRequest'
            examples:
              aceita:
                value:
                  decision: ACCEPTED
                  newScheduledAt: '2027-03-17T14:00:00-03:00'
                  note: Horário ajustado conforme disponibilidade do ambulatório
              recusada:
                value:
                  decision: DECLINED
                  note: Janela do protocolo não comporta adiamento superior a 7 dias
      responses:
        '200':
          description: Decisão registrada sobre a solicitação de reagendamento
          headers:
            ETag:
              schema:
                type: string
              description: Nova versão da solicitação de reagendamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RescheduleRequestDecisionResponse'
              examples:
                aceita:
                  value:
                    request:
                      id: 7
                      studyId: 1
                      participantId: 4
                      participantName: Ana Souza
                      visitId: 15
                      plannedVisitId: 3
                      plannedVisitName: Retorno
                      originalScheduledAt: '2027-03-10T12:00:00Z'
                      status: ACCEPTED
                      reason: Tenho exame em outra cidade na mesma manhã
                      suggestedScheduledAt: '2027-03-17T17:00:00Z'
                      requestedByUserId: 9
                      createdAt: '2027-03-01T15:10:00Z'
                      decidedByUserId: 2
                      decidedAt: '2027-03-02T11:00:00Z'
                      decisionNote: Horário ajustado conforme disponibilidade do ambulatório
                      newScheduledVisitId: 18
                      newScheduledAt: '2027-03-17T17:00:00Z'
                      version: 1
                    originalVisit:
                      id: 15
                      studyId: 1
                      participantId: 4
                      participantName: Ana Souza
                      plannedVisitId: 3
                      plannedVisitName: Retorno
                      scheduledAt: '2027-03-10T12:00:00Z'
                      status: CANCELLED
                      createdByUserId: 2
                      createdAt: '2027-02-15T12:00:00Z'
                      outcomeByUserId: 2
                      outcomeAt: '2027-03-02T11:00:00Z'
                      outcomeNote: Cancelada por reagendamento aceito
                      version: 1
                    newVisit:
