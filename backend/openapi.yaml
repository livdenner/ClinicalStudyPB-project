  /api/studies/{studyId}/planned-visits/{plannedVisitId}:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/PlannedVisitId'
    get:
      tags: [Visitas previstas]
      summary: Consulta uma visita prevista com suas atividades
      description: RESEARCHER ou COORDINATOR. A visita deve pertencer ao estudo da rota.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Visita prevista encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedVisit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
