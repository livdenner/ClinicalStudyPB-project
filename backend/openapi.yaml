openapi: 3.0.3
info:
  title: ClinicalStudyPB API
  version: 1.6.0
  description: |
    Contrato da Release 1 (RF01 a RF11) e da Release 2 em andamento. As rotas
    da Sprint 3 (identidade, ativação e decisão de consentimento do candidato;
    agendamento e desfecho de visitas, RF12 e RF13; resultados, histórico e
    retirada, RF14 a RF16) são o alvo acordado; sua
    presença aqui não indica implementação pronta, e elas só aparecem no
    Swagger UI gerado pela aplicação depois de implementadas.

    Convenções acordadas:
    - Os nomes JSON usam camelCase; os nomes do banco permanecem em snake_case.
    - Os perfis são RESEARCHER, COORDINATOR, ADMINISTRATOR e PARTICIPANT.
    - RESEARCHER responsável altera o próprio estudo; COORDINATOR pode consultá-lo.
    - O responsável por um estudo deve ser um usuário pesquisador ativo.
    - O JWT é stateless; no logout o cliente descarta o token, sem revogação no servidor.
    - Todas as rotas da API usam /api, inclusive autenticação em /api/auth.
    - Códigos de enumeração são estáveis em inglês; a interface traduz os rótulos.
    - RESEARCHER responsável define critérios e visitas previstas e altera o estado.
    - COORDINATOR cadastra candidatos, avalia elegibilidade e inclui participantes.
      Desde a Sprint 3, a decisão de consentimento simulado (GRANTED/DECLINED) é
      registrada só pelo próprio candidato autenticado (PARTICIPANT), no aplicativo.
    - Sessão com mustChangePassword=true só acessa a troca de senha e o logout;
      as demais rotas respondem 403 com code PASSWORD_CHANGE_REQUIRED.
    - Mudanças de estado registram ator, instante e origem/destino em histórico.
    - COORDINATOR agenda visitas e registra o desfecho; RESEARCHER consulta.
    - RESEARCHER responsável registra os resultados fictícios (RF14); COORDINATOR
      registra a retirada (RF16); ambos consultam o histórico do participante (RF15).
    - Erros de regra de negócio da Release 2 trazem `code` estável no ProblemDetail.
servers:
  - url: /
    description: Caminhos completos da API com prefixo /api
tags:
  - name: Autenticação
  - name: Usuários
  - name: Estudos
  - name: Critérios
  - name: Visitas previstas
  - name: Candidatos
  - name: Elegibilidade
  - name: Consentimento
  - name: Participantes
  - name: Visitas agendadas
  - name: Resultados
  - name: Convites do participante
paths:
  /api/auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica um usuário
      description: |
        Público. Retorna um JWT para uso nas operações protegidas. A conta de um
        candidato ainda não ativado responde 401 como usuário inativo; o primeiro
        acesso é feito em /api/auth/activation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticação realizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: E-mail ou senha inválidos, ou usuário inativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerra a sessão no cliente
      description: |
        Requer autenticação. O JWT é stateless: o cliente descarta o token recebido
        no login. Este endpoint confirma o encerramento da sessão no cliente e não
        revoga tokens já emitidos no servidor.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout concluído pelo cliente
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/activation:
    post:
      tags: [Autenticação]
      summary: Primeiro acesso do candidato com o código de ativação (T17.1)
      description: |
        Público. O candidato informa o e-mail cadastrado pelo coordenador e o
        código de ativação de uso único (válido por 72 horas). Com dados
        corretos, a conta PARTICIPANT é ativada e a resposta traz uma sessão
        restrita com user.mustChangePassword=true: até definir a senha em
        PUT /api/auth/password, só a troca de senha e o logout são aceitos.

        O código só é consumido quando a senha é definida. Se o candidato sair
        antes disso, pode repetir esta chamada com o mesmo código enquanto ele
        estiver válido.

        Regras e erros (sem revelar se a conta existe):
        - 400 ACTIVATION_INVALID: e-mail e código não correspondem a uma
          ativação pendente (inclui código já consumido, substituído ou e-mail
          inexistente).
        - 410 ACTIVATION_EXPIRED: e-mail e código correspondem, mas o prazo de
          72 horas passou. O candidato deve pedir um novo código ao coordenador.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequest'
            example:
              email: ana.souza@exemplo.test
              activationCode: K7Q2-9MXA
      responses:
        '200':
          description: Conta ativada; sessão restrita até a troca de senha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          description: Código de ativação expirado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/auth/password:
    put:
      tags: [Autenticação]
      summary: Define ou troca a senha do usuário autenticado (T17.1)
      description: |
        Requer autenticação, inclusive na sessão restrita da ativação. Com
        mustChangePassword=true, currentPassword não é exigida (primeiro acesso);
        caso contrário é obrigatória. Responde com um novo token sem a restrição;
        o cliente deve descartar o token anterior.

        Regras de senha: 8 a 72 caracteres, com ao menos uma letra e um número.

        Regras e erros:
        - 400 PASSWORD_POLICY: newPassword fora das regras de senha.
        - 400 CURRENT_PASSWORD_INVALID: currentPassword ausente ou incorreta
          quando exigida.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              newPassword: NovaSenha2026
      responses:
        '200':
          description: Senha definida; nova sessão sem restrição
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users:
    get:
      tags: [Usuários]
      summary: Lista usuários da equipe
      description: |
        Restrito ao perfil ADMINISTRATOR. Lista só as contas da equipe
        (ADMINISTRATOR, COORDINATOR e RESEARCHER). Contas PARTICIPANT não
        aparecem: nascem e são acompanhadas pelo cadastro de candidato do
        coordenador.

        Regras das rotas /api/users (Sprint 3):
        - Contas PARTICIPANT não são criadas nem administradas aqui: perfil
          PARTICIPANT no corpo responde 409 PARTICIPANT_ROLE_NOT_ALLOWED, e
          /api/users/{userId} de uma conta PARTICIPANT responde 404.
        - O administrador não desativa, não exclui e não troca o perfil da
          própria conta: 409 SELF_ACCOUNT_CHANGE_NOT_ALLOWED. Nome e e-mail
          da própria conta podem ser editados.
        - O sistema nunca fica sem administrador ativo: a operação que deixaria
          zero contas ADMINISTRATOR ativas responde 409 LAST_ACTIVE_ADMINISTRATOR,
          inclusive em requisições concorrentes.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Usuários]
      summary: Cadastra um usuário
      description: |
        Restrito ao perfil ADMINISTRATOR. A senha é armazenada como hash BCrypt e
        o usuário inicia ativo. role=PARTICIPANT responde 409
        PARTICIPANT_ROLE_NOT_ALLOWED (ver regras em GET /api/users).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Usuário cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Usuários]
      summary: Consulta um usuário
      description: Restrito ao perfil ADMINISTRATOR. Conta PARTICIPANT responde 404.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Usuários]
      summary: Atualiza os dados de um usuário
      description: |
        Restrito ao perfil ADMINISTRATOR. O e-mail deve continuar único. Conta
        PARTICIPANT responde 404. Erros 409: PARTICIPANT_ROLE_NOT_ALLOWED
        (role=PARTICIPANT), SELF_ACCOUNT_CHANGE_NOT_ALLOWED (troca do perfil
        da própria conta) e LAST_ACTIVE_ADMINISTRATOR (tirar o perfil do último
        administrador ativo).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Usuários]
      summary: Exclui um usuário
      description: |
        Restrito a ADMINISTRATOR; vínculo com estudo impede a exclusão. Conta
        PARTICIPANT responde 404. Erros 409 adicionais:
        SELF_ACCOUNT_CHANGE_NOT_ALLOWED (própria conta) e
        LAST_ACTIVE_ADMINISTRATOR (último administrador ativo).
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Usuário excluído
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/users/{userId}/activate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Usuários]
      summary: Reativa um usuário
      description: Restrito ao perfil ADMINISTRATOR. Conta PARTICIPANT responde 404.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário reativado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{userId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Usuários]
      summary: Desativa um usuário
      description: |
        Restrito ao perfil ADMINISTRATOR. Conta PARTICIPANT responde 404. Erros
        409: SELF_ACCOUNT_CHANGE_NOT_ALLOWED (própria conta) e
        LAST_ACTIVE_ADMINISTRATOR (último administrador ativo).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário desativado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/studies:
    get:
      tags: [Estudos]
      summary: Lista estudos
      description: Leitura por RESEARCHER ou COORDINATOR.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de estudos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Study'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Estudos]
      summary: Cadastra um estudo
      description: |
        Restrito ao perfil RESEARCHER. O responsável indicado deve existir e estar ativo.
        O responsável também deve ter perfil RESEARCHER. O estado inicial é PLANNING;
        status não é aceito no corpo de cadastro.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyWriteRequest'
      responses:
        '201':
          description: Estudo cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Study'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/studies/{studyId}:
    parameters:
      - $ref: '#/components/parameters/StudyId'
    get:
      tags: [Estudos]
      summary: Consulta um estudo
      description: Leitura por RESEARCHER ou COORDINATOR.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estudo encontrado
          headers:
            ETag:
              description: Versão do estudo para enviar em If-Match ao alterar o protocolo
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Study'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Estudos]
      summary: Atualiza um estudo
      description: |
        Restrito ao RESEARCHER responsável, em PLANNING ou RECRUITMENT.
        Datas devem respeitar startDate <= endDate e a
        edição preserva status. Quando existirem visitas previstas, o novo
        período deve continuar incluindo suas datas. participantLimit não pode
        ficar abaixo da quantidade de participantes já incluídos (409).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyWriteRequest'
      responses:
        '200':
          description: Estudo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Study'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/studies/{studyId}/status:
    parameters:
      - $ref: '#/components/parameters/StudyId'
    patch:
      tags: [Estudos]
      summary: Altera o estado do estudo (RF07, T11.1)
      description: |
        Somente RESEARCHER responsável. Fluxo normal PLANNING -> RECRUITMENT ->
        EXECUTION -> CLOSED. RECRUITMENT pode voltar a PLANNING. PLANNING,
        RECRUITMENT e EXECUTION podem ir a CANCELLED com justificativa.
        CANCELLED originado de PLANNING ou RECRUITMENT retorna apenas ao estado
        de origem; cancelamento em EXECUTION e CLOSED são terminais.
        expectedStatus deve refletir o estado atual; divergência responde 409.
        Para iniciar RECRUITMENT: critérios de inclusão e exclusão e visita com
        atividade. Para iniciar EXECUTION: ao menos um participante incluído.

        Visitas agendadas (Sprint 3):
        - CLOSED exige que nenhuma visita do estudo esteja SCHEDULED; o
          coordenador registra antes o desfecho de cada uma (DONE, ABSENT ou
          CANCELLED). Caso contrário responde 409 STUDY_HAS_SCHEDULED_VISITS,
          sem alterar o estudo nem as visitas.
        - CANCELLED cancela, na mesma transação, todas as visitas SCHEDULED do
          estudo: passam a CANCELLED com outcomeNote "Cancelamento do estudo",
          outcomeByUserId do pesquisador que cancelou, outcomeAt igual ao
          instante do cancelamento e version incrementada. Visitas DONE, ABSENT
          ou CANCELLED não mudam. Desfazer o cancelamento (volta a PLANNING ou
          RECRUITMENT) não reabre essas visitas; é preciso agendar de novo.
        - A mudança de estado e o agendamento são serializados por estudo: um
          agendamento concorrente com CLOSED ou CANCELLED é recusado ou entra
          antes e é tratado pela regra acima.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyStatusChangeRequest'
            example:
              status: RECRUITMENT
              expectedStatus: PLANNING
      responses:
        '200':
          description: Estudo com o novo estado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Study'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/studies/{studyId}/status-history:
    parameters:
      - $ref: '#/components/parameters/StudyId'
    get:
      tags: [Estudos]
      summary: Consulta o histórico de estados do estudo
      description: RESEARCHER ou COORDINATOR. Histórico ordenado de mudanças.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mudanças de estado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudyStatusHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/studies/{studyId}/criteria:
    parameters:
      - $ref: '#/components/parameters/StudyId'
    get:
      tags: [Critérios]
      summary: Lista critérios de inclusão e exclusão (RF05, T9.1)
      description: RESEARCHER ou COORDINATOR. Lista vazia quando não há critérios.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Critérios do estudo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudyCriterion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Critérios]
      summary: Define um critério do estudo (RF05, T9.1)
      description: |
        Somente RESEARCHER. Um critério INCLUSION deve ser satisfeito; um critério
        EXCLUSION não deve ser satisfeito para a elegibilidade final. Na Release 1,
        critérios cadastrados são preservados para manter avaliações rastreáveis.
        Após a primeira resposta de elegibilidade de qualquer candidato do estudo,
        novos critérios não podem ser adicionados (409), evitando invalidar avaliações.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyCriterionWriteRequest'
            example:
              type: INCLUSION
              description: Idade mínima de 18 anos
      responses:
        '201':
          description: Critério criado
          headers:
            Location:
              schema:
                type: string
              description: Caminho do critério criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyCriterion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/studies/{studyId}/criteria/{criterionId}:
    parameters:
      - $ref: '#/components/parameters/StudyId'
      - $ref: '#/components/parameters/CriterionId'
    get:
      tags: [Critérios]
      summary: Consulta um critério do estudo
      description: RESEARCHER ou COORDINATOR. O critério deve pertencer ao estudo da rota.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Critério encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyCriterion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/studies/{studyId}/planned-visits:
    parameters:
      - $ref: '#/components/parameters/StudyId'
    get:
      tags: [Visitas previstas]
      summary: Lista visitas previstas com suas atividades (RF06, T10.1)
      description: |
        RESEARCHER ou COORDINATOR. São definições do protocolo; não representam
        visitas agendadas para um participante. O agendamento por participante
        (RF12) fica em /api/studies/{studyId}/participants/{participantId}/visits.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Visitas previstas do estudo; [] quando não há registros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlannedVisit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Visitas previstas]
      parameters:
        - $ref: '#/components/parameters/StudyVersion'
      summary: Define uma visita prevista e suas atividades (RF06, T10.1)
      description: |
        Somente RESEARCHER responsável em PLANNING ou RECRUITMENT. A data prevista
        deve estar dentro do período do estudo. Deve haver ao menos uma atividade.
        position opcional insere no meio e desloca as visitas seguintes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannedVisitWriteRequest'
            example:
              name: Avaliação inicial
              plannedDate: '2027-02-10'
              position: 1
              activities:
                - name: Entrevista inicial
                  description: Registrar histórico clínico
                - name: Aferição de pressão
                  description: Medir a pressão arterial
      responses:
