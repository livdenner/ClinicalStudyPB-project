              schema:
                $ref: '#/components/schemas/PlannedVisit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Visitas previstas]
      parameters:
        - $ref: '#/components/parameters/StudyVersion'
      summary: Exclui uma visita prevista e suas atividades
      description: |
        RESEARCHER responsável em PLANNING ou RECRUITMENT. Em RECRUITMENT,
        a última visita não pode ser removida. Visitas previstas com visitas
        agendadas associadas (em qualquer situação) não podem ser excluídas (409).
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Visita excluída
        '401':
