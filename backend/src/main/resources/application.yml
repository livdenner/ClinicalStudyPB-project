spring:
  application:
    name: clinicalstudypb
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
app:
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
