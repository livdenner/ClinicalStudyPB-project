services:
  db:
    image: postgres:18
    container_name: clinicalstudypb-db
    environment:
      POSTGRES_DB: clinicalstudypb
      POSTGRES_USER: ${DB_USER:-clinicalstudypb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"
    volumes:
      - clinicalstudypb_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: clinicalstudypb-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/clinicalstudypb
      DB_USER: ${DB_USER:-clinicalstudypb}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Defina JWT_SECRET_BASE64 no arquivo .env}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clinicalstudypb_pgdata:
